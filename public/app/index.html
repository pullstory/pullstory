// Desk — 뒷면. 위는 쌓아 온 책, 아래는 아직 어디에도 묶이지 않은 낱장의 글.
// 책은 각자의 자리에서 내보내고, 여기서는 글만 쓴다.
// ═════════════════════════════════════════════════════════════════════
function DeskPage({data, setData, user, profile, notes, noteApi, onEditPen, onNeedHandle, goPage, goBook}) {
  const [view, setView] = useState("list");     // list | edit | bind
  const [editId, setEditId] = useState(null);
  const [picked, setPicked] = useState([]);
  const [bindTitle, setBindTitle] = useState("");
  const [bindCat, setBindCat] = useState("C");
  const [busy, setBusy] = useState(false);

  const [collId, setCollId] = useState(null);   // 펼쳐 본 묶음 책

  const year = new Date().getFullYear();
  const allBooks = ((data.chapters || {})[year] || {}).tasks || [];
  const books = allBooks.filter(b => b.type !== "collection");        // Books에서 만든 책
  const bound = allBooks.filter(b => b.type === "collection");        // Notes에서 묶은 책

  // 묶음 책은 Desk가 직접 건사한다
  const setBooks = (fn) => {
    const chapters = data.chapters || {};
    const ch = chapters[year] || {tasks: []};
    setData({...data, chapters: {...chapters, [year]: {...ch, tasks: fn(ch.tasks || [])}}});
  };
  const updateColl = (id, up) => setBooks(bs => bs.map(b => b.id === id ? up(b) : b));
  const toggleCollStatus = (id) =>
    updateColl(id, b => ({...b, status: b.status === "완료" ? "진행중" : "완료"}));
  const deleteColl = async (id) => {
    // 책만 없애고 글은 낱장으로 되돌린다 — 묶은 걸 푸는 것이지 지우는 게 아니다
    for (const n of notes.filter(x => String(x.bookId) === String(id))) {
      await noteApi.update(n.id, {bookId: null});
    }
    setBooks(bs => bs.filter(b => b.id !== id));
    setCollId(null);
  };
  const records = data.pageRecords || {};
  const loose = notes.filter(n => !n.bookId);
  const notesOf = (id) => notes.filter(n => String(n.bookId) === String(id));
  const publishedDays = Object.keys(records).filter(k => records[k] && records[k].published).length;
  const collBook = collId != null ? bound.find(b => b.id === collId) : null;

  const penName = (profile && profile.penName) || "작가";
  const handle = (profile && profile.handle) || "";

  const dateOf = (n) => {
    const d = new Date(noteTs(n) || Date.now());
    return `${String(d.getMonth()+1).padStart(2,"0")}.${String(d.getDate()).padStart(2,"0")}`;
  };

  // ── 글 ──
  const startNew = async () => {
    if (!noteApi.live) { alert("글을 쓰려면 Google 로그인이 필요해요."); return; }
    const id = await noteApi.create({});
    if (id) { setEditId(id); setView("edit"); }
  };
  const toggleVis = async (n) => {
    const uid = user && user.uid;
    const next = n.visibility === "public" ? "private" : "public";
    await noteApi.update(n.id, {visibility: next});
    try {
      if (next === "public") await publishNote(uid, profile, n);
      else await unpublishNote(uid, handle, n.id);
    } catch (e) { console.warn("note feed:", e); }
  };

  const editing = editId ? notes.find(n => n.id === editId) : null;
  const bodyOf = (n) => noteBlocks(n).filter(b => b.t === "p").map(b => b.v).join("\n");

  // 아무것도 안 쓰고 나가면 빈 글을 남기지 않는다
  const closeEditor = async () => {
    const n = editId ? notes.find(x => x.id === editId) : null;
    setEditId(null); setView("list");
    if (n && noteIsEmpty(n)) await noteApi.remove(n.id);
  };

  // ── 묶기 ──
  const startBind = () => { setPicked([]); setBindTitle(""); setBindCat("C"); setView("bind"); };
  const togglePick = (id) =>
    setPicked(ps => ps.indexOf(id) >= 0 ? ps.filter(x => x !== id) : [...ps, id]);

  const makeBook = async () => {
    const title = bindTitle.trim();
    if (!title || picked.length === 0 || busy) return;
    setBusy(true);
    const bookId = Date.now() + Math.random();
    // 묶음 책 — 표도 데드라인도 없다. 글로만 쌓인다
    const chapters = data.chapters || {};
    const ch = chapters[year] || {tasks: []};
    setData({...data, chapters: {...chapters, [year]: {...ch, tasks: [...(ch.tasks || []), {
      id: bookId, cat: bindCat, type: "collection", text: title, status: "진행중", ts: Date.now(),
    }]}}});
    // 고른 글에 '이 책 소속' 표시만 붙인다 — 옮겨 담지 않는다
    for (const nid of picked) await noteApi.update(nid, {bookId: String(bookId)});
    setBusy(false);
    setView("list");
  };

  // ── 책 한 권 ──
  const BookCard = ({b, onOpen}) => {
    const t = taskTypeOf(b);
    const isColl = b.type === "collection";
    const bc = BC[b.cat] || BC.C;
    const span = bookSpan(b);
    const filled = ((b[span.key] || {}).done || []).length;
    const cnt = notesOf(b.id).filter(n => !noteIsEmpty(n)).length;
    const st = isColl ? `글 ${cnt}편`
      : t === "habit" ? `${filled}/${span.duration || 0} · 글 ${cnt}`
      : `${b.status === "완료" ? "완료" : "진행중"} · 글 ${cnt}`;
    return (
      <button className="dk-bk" onClick={onOpen || (()=>goBook(b.id))} title={b.text}>
        <div className="dk-sp" style={{background: bc.sp}}/>
        <div className="dk-in" style={{background: bc.g}}>
          <div className="dk-fr"/>
          <div className={"dk-bd " + (b.published ? "on" : "off")}>{b.published ? "공개" : "나만"}</div>
          <div className="dk-ty">{isColl ? "✍️ 묶음" : t === "habit" ? "🔁 습관" : "🏆 성취"}</div>
          <div className="dk-tt">{b.text || "(제목 없음)"}</div>
          <div className="dk-st">{st}</div>
        </div>
      </button>
    );
  };

  // ══ 글 쓰기 ══
  if (view === "edit" && editing) {
    return (
      <div style={{animation:"fadeIn .3s"}}>
        <div className="dk-bar">
          <button className="dk-back" onClick={closeEditor}>‹ Desk로</button>
          <span className="dk-save">저장됨</span>
        </div>
        <BufferedInput className="dk-tin" value={editing.title || ""} placeholder="제목"
          onSave={(v)=>noteApi.update(editing.id, {title: v})}/>
        <BufferedTA className="dk-bin" value={bodyOf(editing)} placeholder="자유롭게 써 내려가세요…"
          onSave={(v)=>noteApi.update(editing.id, {blocks: [{t:"p", v}], body: ""})}/>
        <div className={"dk-pub" + (editing.visibility === "public" ? " on" : "")}>
          <span className="t">이 글 내보내기</span>
          <button className={"dk-sw" + (editing.visibility === "public" ? " on" : "")}
            onClick={()=>{ if (editing.visibility !== "public" && !handle) { onNeedHandle(); return; } toggleVis(editing); }}/>
        </div>
        <div className="mb-foot">
          <button className="mb-fbtn done" onClick={closeEditor}>✓ 다 썼어요</button>
          <button className="mb-fbtn del" onClick={async ()=>{
            if (!confirm("이 글을 삭제할까요?")) return;
            await noteApi.remove(editing.id); setEditId(null); setView("list");
          }}>삭제</button>
        </div>
      </div>
    );
  }

  // ══ 낱장을 묶어 책으로 ══
  if (view === "bind") {
    return (
      <div style={{animation:"fadeIn .3s"}}>
        <div className="dk-bar">
          <button className="dk-back" onClick={()=>setView("list")}>‹ 그만두기</button>
          <span style={{fontSize:"9.5px",color:"#a89066"}}>{picked.length}편 고름</span>
        </div>
        <div className="dk-sect"><span className="k">묶을 글</span><span className="l"/></div>
        {loose.length === 0 ? (
          <div className="dk-empty">묶을 낱장이 없어요.</div>
        ) : loose.map(n => {
          const on = picked.indexOf(n.id) >= 0;
          return (
            <button key={n.id} className={"dk-sh" + (on ? " pick" : "")} onClick={()=>togglePick(n.id)}>
              <span className={"dk-chk" + (on ? " on" : "")}>{on ? "✓" : ""}</span>
              <span className="dk-shn">
                <span className="dk-sht">{n.title || "(제목 없음)"}</span>
                <span className="dk-shd">{dateOf(n)}</span>
              </span>
            </button>
          );
        })}
        <div style={{marginTop:"15px"}}>
          <div style={{fontSize:"9px",fontWeight:700,color:"#9c7f4e",marginBottom:"6px"}}>어느 영역의 책인가요</div>
          <div className="dk-cats">
            {CASH_KEYS.map(k => {
              const on = bindCat === k;
              return (
                <button key={k} className={"dk-cat" + (on ? " on" : "")} onClick={()=>setBindCat(k)}
                  style={{borderColor: EP_COL[k],
                          background: on ? EP_COL[k] : "transparent",
                          color: on ? "#fff8ea" : EP_INK[k]}}>
                  <b>{k}</b><span>{CK[k]}</span>
                </button>
              );
            })}
          </div>
        </div>

        <div style={{marginTop:"14px"}}>
          <div style={{fontSize:"9px",fontWeight:700,color:"#9c7f4e",marginBottom:"5px"}}>책 제목</div>
          <input className="input" value={bindTitle} maxLength={40} placeholder="이 글들을 무엇이라 부를까요"
            onChange={e=>setBindTitle(e.target.value)} style={{fontSize:"14px",fontWeight:700}}/>
        </div>
        <button className="dk-mk" disabled={!bindTitle.trim() || picked.length === 0 || busy} onClick={makeBook}>
          {busy ? "묶는 중…" : `이 ${picked.length}편으로 책 만들기`}
        </button>
        <div className="dk-foot">묶인 글은 낱장 목록에서 빠져 책 안으로 들어갑니다<br/>언제든 다시 풀 수 있어요</div>
      </div>
    );
  }

  // ══ Desk ══
  return (
    <div style={{animation:"fadeIn .4s"}}>
      <div className="sf-head">
        <div className="sf-title">Desk</div>
        <div className="sf-desc">무엇을 내보낼지 여기서 정합니다</div>
      </div>

      <div className="dk-prof">
        <button className="dk-av" onClick={onEditPen} title="프로필 고치기">{penName.slice(0,1)}</button>
        <button className="dk-nm" onClick={onEditPen}>{penName} <i>✎</i></button>
        {handle
          ? <div className="dk-u">pullstory.net/u/{handle}</div>
          : <button className="dk-u set" onClick={onNeedHandle}>책장 주소 정하기</button>}
        {handle && <div><a className="dk-visit" href={"/u/"+handle} target="_blank" rel="noopener">책장 보기 <i>↗</i></a></div>}
        {(profile && profile.intro)
          ? <div className="dk-bio">{profile.intro}</div>
          : <button className="dk-bio add" onClick={onEditPen}>＋ 소개 쓰기</button>}
      </div>

      <div className="dk-sect"><span className="k">Books</span><span className="s">쌓아 온 책</span><span className="l"/></div>
      <div className="dk-shelf">
        <button className="dk-bk dk-story" onClick={()=>goPage("now")} title="Story Book">
          <div className="dk-sp" style={{background:"#8a6a2a"}}/>
          <div className="dk-in">
            <div className="dk-fr"/>
            <div className={"dk-bd " + (publishedDays > 0 ? "on" : "off")}>
              {publishedDays > 0 ? publishedDays + "장" : "나만"}
            </div>
            <div className="dk-ty">📖 스토리북</div>
            <div className="dk-tt">Story<br/>Book</div>
            <div className="dk-st">{data.pageCount || 0}장</div>
          </div>
        </button>
        {books.map(b => <BookCard key={b.id} b={b}/>)}
      </div>

      <div className="dk-sect"><span className="k">Notes</span><span className="s">묶은 책과 낱장의 글</span><span className="l"/></div>

      {bound.length > 0 && (
        <div className="dk-shelf">
          {bound.map(b => <BookCard key={b.id} b={b} onOpen={()=>setCollId(b.id)}/>)}
        </div>
      )}

      {loose.length === 0 ? (
        <div className="dk-empty">아직 쓴 글이 없어요.<br/>무엇이든 자유롭게 적어보세요.</div>
      ) : loose.map(n => (
        <div key={n.id} className="dk-sh" style={{cursor:"default"}}>
          <span className="dk-shn" style={{cursor:"pointer"}} onClick={()=>{ setEditId(n.id); setView("edit"); }}>
            <span className="dk-sht">{n.title || "(제목 없음)"}</span>
            <span className="dk-shd">{dateOf(n)}</span>
          </span>
          <span className={"dk-tag " + (n.visibility === "public" ? "on" : "off")}>
            {n.visibility === "public" ? "공개" : "나만"}
          </span>
          <button className={"dk-sw" + (n.visibility === "public" ? " on" : "")}
            onClick={()=>{ if (n.visibility !== "public" && !handle) { onNeedHandle(); return; } toggleVis(n); }}/>
        </div>
      ))}

      <div className="dk-acts" style={{marginTop:"11px",marginBottom:0}}>
        <button className="dk-new" onClick={startNew}>⊕ 새 글 쓰기</button>
        <button className="dk-bind" disabled={loose.length === 0} onClick={startBind}>📎 묶기</button>
      </div>

      <div className="dk-foot">Books의 책은 각자의 자리에서 내보냅니다<br/>여기서는 글을 쓰고 묶습니다</div>

      {collBook && (
        <BookDetail key={collBook.id} book={collBook} bc={BC[collBook.cat] || BC.C}
          records={data.pageRecords || {}} backLabel="‹ Desk로"
          onClose={()=>setCollId(null)}
          updateBook={updateColl} deleteBook={deleteColl} toggleStatus={toggleCollStatus}
          uid={user && user.uid} profile={profile} onNeedHandle={onNeedHandle}
          notes={notes} noteApi={noteApi}/>
      )}
    </div>
  );
}

function PageBook({data, setData, onLogout, user, profile, onSaveProfile, notes, noteApi}) {
  const [pageIdx, setPageIdx] = useState(() => PAGES.findIndex(p=>p.key==="future"));  // 시작: 미래
  const [menu, setMenu] = useState(false);
  const [editPen, setEditPen] = useState(false);
  const [needHandle, setNeedHandle] = useState(false);
  const [openBookId, setOpenBookId] = useState(null);   // Desk에서 책을 눌러 들어온 경우
  const [bookFrom, setBookFrom] = useState(null);       // 닫으면 돌아갈 자리
  const [dragDx, setDragDx] = useState(0);
  const [isDragging, setIsDragging] = useState(false);
  const dragRef = useRef({active:false, x:0, y:0, moved:false});

  const goPrev = useCallback(() => setPageIdx(i => Math.max(0, i-1)), []);
  const goNext = useCallback(() => setPageIdx(i => Math.min(PAGES.length-1, i+1)), []);

  // 터치 스와이프 (모바일)
  const onTouchStart = e => {
    dragRef.current = {active:true, x:e.touches[0].clientX, y:e.touches[0].clientY, moved:false};
  };
  const onTouchEnd = e => {
    const t = e.changedTouches[0];
    const dx = t.clientX - dragRef.current.x;
    const dy = t.clientY - dragRef.current.y;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)*1.2) {
      if (dx < 0) goNext(); else goPrev();
    }
    dragRef.current.active = false;
  };

  // 마우스 드래그 (PC)
  const onMouseDown = (e) => {
    // 입력 요소나 버튼 클릭은 드래그로 인식하지 않음
    if (e.target.closest('input,textarea,button,select,a,label,img')) return;
    if (e.button !== 0) return;
    e.preventDefault();
    dragRef.current = {active:true, x:e.clientX, y:e.clientY, moved:false};
    setIsDragging(true);
    setDragDx(0);
  };

  useEffect(() => {
    const onMove = (e) => {
      if (!dragRef.current.active) return;
      const dx = e.clientX - dragRef.current.x;
      if (Math.abs(dx) > 5) dragRef.current.moved = true;
      // 드래그 프리뷰 (양 끝에서는 저항)
      setDragDx(dx * 0.5);
    };
    const onUp = (e) => {
      if (!dragRef.current.active) return;
      dragRef.current.active = false;
      const dx = (e.clientX !== undefined ? e.clientX : dragRef.current.x) - dragRef.current.x;
      const threshold = Math.min(80, window.innerWidth * 0.18);
      if (Math.abs(dx) > threshold) {
        if (dx < 0) goNext(); else goPrev();
      }
      setIsDragging(false);
      setDragDx(0);
    };
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    return () => {
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    };
  }, [goPrev, goNext]);

  // 키보드 화살표 지원
  useEffect(() => {
    const onKey = e => {
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
      if (e.key === "ArrowLeft") goPrev();
      else if (e.key === "ArrowRight") goNext();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [goPrev, goNext]);

  const renderPage = (key) => {
    switch(key) {
      case "future":   return <FuturePage   data={data} setData={setData}/>;
      case "climax":   return <GoalsPage    data={data} setData={setData}/>;
      case "chapters": return <HomePage     data={data} setData={setData} user={user}
                                profile={profile} onNeedHandle={()=>setNeedHandle(true)}
                                notes={notes} noteApi={noteApi}
                                openBookId={openBookId} onOpenedBook={()=>setOpenBookId(null)}
                                bookFrom={bookFrom}
                                onReturn={()=>{ const k = bookFrom; setBookFrom(null);
                                  if (k) setPageIdx(PAGES.findIndex(x=>x.key===k)); }}/>;
      case "writing":  return <EpisodePage  data={data} setData={setData} user={user}
                                profile={profile} onNeedHandle={()=>setNeedHandle(true)}/>;
      case "now":      return <HistoryPage  data={data} setData={setData} user={user}
                                profile={profile} onNeedHandle={()=>setNeedHandle(true)}/>;
      case "workshop": return <DeskPage data={data} setData={setData} user={user} profile={profile}
                                notes={notes} noteApi={noteApi}
                                onEditPen={()=>setEditPen(true)} onNeedHandle={()=>setNeedHandle(true)}
                                goPage={(k)=>setPageIdx(PAGES.findIndex(x=>x.key===k))}
                                goBook={(id)=>{ setOpenBookId(id); setBookFrom("workshop");
                                  setPageIdx(PAGES.findIndex(x=>x.key==="chapters")); }}/>;
      default: return null;
    }
  };

  const cur = PAGES[pageIdx];
  // 하단 네비: 표지(마지막 idx) 제외 → 현재 · 에피소드 · 챕터 · 클라이맥스 · 미래
  const menuPages = PAGES;
  const isCover = cur.key === "cover";
  const isFirst = pageIdx === 0;
  const isLast = pageIdx === PAGES.length-1;

  return (
    <div style={{height:"100%",background:"linear-gradient(180deg,#3a2c1e,#1a0f08)",position:"relative",overflow:"hidden",userSelect:isDragging?"none":"auto",cursor:isDragging?"grabbing":"auto"}}
         onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}
         onMouseDown={onMouseDown}>

      {/* Top bar */}
      <div style={{position:"absolute",top:0,left:0,right:0,height:"52px",background:"linear-gradient(180deg,rgba(0,0,0,.5),transparent)",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"0 14px",zIndex:10,paddingTop:"max(8px,env(safe-area-inset-top))"}}>
        <button onClick={()=>setMenu(true)} style={{background:"rgba(0,0,0,.4)",border:"1px solid rgba(212,168,81,.3)",color:"#d4a851",borderRadius:"6px",padding:"6px 12px",fontSize:"12px",cursor:"pointer"}}>☰</button>
        <div style={{textAlign:"center",pointerEvents:"none"}}>
          {cur.sub && <div className="heading-latin" style={{fontSize:"10px",color:"#d4a85188",letterSpacing:"2px"}}>{cur.sub}</div>}
          <div className="heading-serif" style={{fontSize:"14px",color:"#d4a851",fontWeight:700,marginTop:"-1px"}}>{cur.title}</div>
        </div>
        <div style={{fontSize:"11px",color:"#d4a85199",fontWeight:700}} className="heading-latin">{data.pageCount||0}p</div>
      </div>

      {/* Pages carousel */}
      <div style={{position:"absolute",top:"52px",bottom:"56px",left:0,right:0,display:"flex",transform:`translateX(calc(${-pageIdx*100}% + ${dragDx}px))`,transition:isDragging?"none":"transform .42s cubic-bezier(.4,.1,.3,1)",willChange:"transform"}}>
        {PAGES.map((p,i)=>(
          <div key={p.key} style={{minWidth:"100%",height:"100%",padding:"10px 10px"}}>
            {p.key === "cover" ? (
              <div style={{height:"100%",borderRadius:"6px",overflow:"hidden",boxShadow:"0 4px 14px rgba(0,0,0,.4)"}}>
                {Math.abs(i - pageIdx) <= 1 ? renderPage(p.key) : null}
              </div>
            ) : (
              <div className="paper paper-edge" style={{height:"100%",borderRadius:"6px",overflow:"hidden",position:"relative"}}>
                <div className="page-wrap" style={{height:"100%",overflow:"auto"}}>
                  <div style={{padding:"22px 18px"}}>
                    {Math.abs(i - pageIdx) <= 1 ? renderPage(p.key) : null}
                  </div>
                </div>
              </div>
            )}
          </div>
        ))}
      </div>

      {/* Side arrows — 항상 표시 (PC 사용성) */}
      <button onClick={goPrev} disabled={isFirst} style={{
        position:"absolute",left:"4px",top:"50%",transform:"translateY(-50%)",
        background:"rgba(0,0,0,.5)",border:"1px solid rgba(212,168,81,.4)",borderRadius:"50%",
        width:"26px",height:"26px",color:isFirst?"#5a4828":"#d4a851",
        cursor:isFirst?"not-allowed":"pointer",fontSize:"15px",zIndex:5,
        display:"flex",alignItems:"center",justifyContent:"center",
        opacity:isFirst?.3:.85,transition:"opacity .2s,transform .15s",
        fontFamily:"serif",lineHeight:1,paddingBottom:"2px",
        boxShadow:isFirst?"none":"0 1px 4px rgba(0,0,0,.3)"
      }}>‹</button>
      <button onClick={goNext} disabled={isLast} style={{
        position:"absolute",right:"4px",top:"50%",transform:"translateY(-50%)",
        background:"rgba(0,0,0,.5)",border:"1px solid rgba(212,168,81,.4)",borderRadius:"50%",
        width:"26px",height:"26px",color:isLast?"#5a4828":"#d4a851",
        cursor:isLast?"not-allowed":"pointer",fontSize:"15px",zIndex:5,
        display:"flex",alignItems:"center",justifyContent:"center",
        opacity:isLast?.3:.85,transition:"opacity .2s,transform .15s",
        fontFamily:"serif",lineHeight:1,paddingBottom:"2px",
        boxShadow:isLast?"none":"0 1px 4px rgba(0,0,0,.3)"
      }}>›</button>

      {/* Bottom navigation — 표지 제외 + RTL 순서: 현재 · 에피소드 · 챕터 · 클라이맥스 · 미래 */}
      <div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(0deg,rgba(0,0,0,.7),transparent)",padding:"8px 8px",paddingBottom:"max(8px,env(safe-area-inset-bottom))",zIndex:10}}>
        <div style={{display:"flex",justifyContent:"space-around",gap:"4px"}}>
          {menuPages.map((p)=>{
            const idx = PAGES.findIndex(x=>x.key===p.key);
            const active = idx===pageIdx;
            return (
              <button key={p.key} onClick={()=>setPageIdx(idx)} style={{
                flex:1,
                padding:"8px 4px",
                background:active?"rgba(212,168,81,.2)":"transparent",
                border:"none",
                borderRadius:"8px",
                borderTop:active?"2px solid #d4a851":"2px solid transparent",
                color:active?"#d4a851":"#8a7556",
                cursor:"pointer",
                transition:"all .2s",
                fontFamily:"'Noto Sans KR',sans-serif",
                display:"flex",alignItems:"center",justifyContent:"center"
              }} title={p.title}>
                <NavIcon k={p.key}/>
              </button>
            );
          })}
        </div>
      </div>

      {needHandle && (
        <PenNamePlate
          mode="handle"
          initial={(profile && profile.penName) || ""}
          handle={(profile && profile.handle) || ""}
          uid={user && user.uid}
          onSave={async (patch)=>{ await onSaveProfile(patch); if (patch.handle) setNeedHandle(false); }}
          onClose={()=>setNeedHandle(false)}
        />
      )}

      {editPen && (
        <PenNamePlate
          mode="edit"
          initial={(profile && profile.penName) || ""}
          intro={(profile && profile.intro) || ""}
          handle={(profile && profile.handle) || ""}
          uid={user && user.uid}
          onSave={async (patch)=>{ await onSaveProfile(patch); if (patch.penName) setEditPen(false); }}
          onClose={()=>setEditPen(false)}
        />
      )}

      {/* Menu overlay (햄버거) — 메뉴는 RTL 순서로 표시 */}
      {menu && (
        <div onClick={()=>setMenu(false)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.7)",zIndex:50,display:"flex",alignItems:"flex-start",justifyContent:"flex-start",animation:"fadeIn .2s"}}>
          <div onClick={e=>e.stopPropagation()} style={{width:"260px",height:"100%",background:"linear-gradient(180deg,#3a2c1e,#1a0f08)",padding:"20px",paddingTop:"max(20px,env(safe-area-inset-top))",borderRight:"1px solid #6a5538",overflow:"auto"}}>
            <div style={{textAlign:"center",marginBottom:"20px",paddingBottom:"16px",borderBottom:"1px solid #4a3520"}}>
              <div className="heading-latin" style={{fontSize:"22px",color:"#d4a851",fontWeight:700,letterSpacing:"2px"}}>CASH Room</div>
              <button className="pn-name" onClick={()=>setEditPen(true)} title="필명 고치기">
                {(profile && profile.penName) || "작가"}님 <i>✎</i>
              </button>
              {data.bookTitle && <div className="heading-script" style={{fontSize:"15px",color:"#b8924a",marginTop:"6px"}}>『{data.bookTitle}』</div>}
            </div>
            <div style={{padding:"10px",background:"rgba(212,168,81,.1)",borderRadius:"8px",marginBottom:"14px",textAlign:"center"}}>
              <div className="heading-latin" style={{fontSize:"32px",color:"#d4a851",fontWeight:700,lineHeight:1}}>{data.pageCount||0}<span style={{fontSize:"14px"}}>p</span></div>
              <div style={{fontSize:"10px",color:"#9c7a2a",marginTop:"4px"}}>지금까지 쓴 페이지</div>
            </div>
            {/* 자연 순서: 현재 → 에피소드 → 챕터 → 클라이맥스 → 미래 → 표지 */}
            {PAGES.map((p)=>{
              const idx = PAGES.findIndex(x=>x.key===p.key);
              const active = idx===pageIdx;
              return (
                <button key={p.key} onClick={()=>{setPageIdx(idx);setMenu(false);}} style={{
                  display:"block",width:"100%",textAlign:"left",
                  padding:"12px 14px",marginBottom:"4px",
                  background:active?"rgba(212,168,81,.15)":"transparent",
                  border:"1px solid "+(active?"#d4a85155":"transparent"),
                  borderRadius:"6px",color:active?"#d4a851":"#b8924a",
                  cursor:"pointer",fontSize:"13px"
                }}>
                  <span style={{fontWeight:700}}>{p.label}</span>
                  {p.sub && <span style={{marginLeft:"8px",fontSize:"10px",color:"#8a7556"}}>· {p.sub}</span>}
                </button>
              );
            })}
            <div style={{marginTop:"20px",paddingTop:"16px",borderTop:"1px solid #4a3520"}}>
              <a href="/shelf/" style={{display:"block",width:"100%",boxSizing:"border-box",textAlign:"center",padding:"10px",marginBottom:"8px",background:"rgba(212,168,81,.12)",border:"1px solid #6a5538",color:"#d4a851",borderRadius:"6px",textDecoration:"none",fontSize:"12px"}}>← 내 책장</a>
              <a href="/" style={{display:"block",width:"100%",boxSizing:"border-box",textAlign:"center",padding:"10px",marginBottom:"14px",background:"transparent",border:"1px solid #6a5538",color:"#b8924a",borderRadius:"6px",textDecoration:"none",fontSize:"12px"}}>PULLSTORY 홈</a>
              <button onClick={onLogout} style={{width:"100%",padding:"10px",background:"transparent",border:"1px solid #6a5538",color:"#9c7a2a",borderRadius:"6px",cursor:"pointer",fontSize:"12px"}}>로그아웃</button>
              <div style={{textAlign:"center",fontSize:"9px",color:"#6a5538",marginTop:"14px",letterSpacing:"1px"}}>끌당 출판사 · © 2026</div>
              {!FIREBASE_READY && <div style={{textAlign:"center",fontSize:"9px",color:"#8a6630",marginTop:"4px",opacity:.6}}>로컬 모드</div>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════════
// 메인 앱
// ═════════════════════════════════════════════════════════════════════
function App() {
  const [user, setUser] = useState(null);
  const [data, setDataState] = useState(null);
  const [profile, setProfile] = useState(null);   // {penName, handle}
  const [notes, setNotes] = useState([]);        // 모든 글 — 낱장이든 책에 묶였든 여기 산다
  const [opened, setOpened] = useState(false);
  const [loading, setLoading] = useState(true);

  // 초기화: 기존 세션 확인
  useEffect(() => {
    const initLocal = () => {
      const localUser = localStorage.getItem(LS_AUTH);
      if (localUser) {
        try {
          const u = JSON.parse(localUser);
          setUser(u);
          setProfile(loadProfileLocal());
          const d = loadLocal() || {...defaultData(), startDate:todayStr()};
          setDataState(d);
        } catch(e) {}
      }
      setLoading(false);
    };

    if (FIREBASE_READY) {
      const unsub = fbAuth.onAuthStateChanged(async (fbUser) => {
        if (fbUser) {
          const u = {uid:fbUser.uid, name:fbUser.displayName||"작가"};
          setUser(u);
          setProfile(await loadProfile(fbUser.uid));
          const remote = await loadRemote(fbUser.uid);
          const d = remote || loadLocal() || {...defaultData(), startDate:todayStr()};
          setDataState(d);
          setLoading(false);
        } else {
          // Check for local session as fallback
          initLocal();
        }
      });
      return () => unsub && unsub();
    } else {
      initLocal();
    }
  }, []);

  // ── 글 ──────────────────────────────────────────────────
  // 낱장이든 책에 묶였든 글은 전부 notes에 있고, bookId로 어디 속하는지만 표시한다.
  // 묶기는 그 표시를 붙이는 일, 풀기는 떼는 일이 된다.
  useEffect(() => {
    const uid = user && user.uid;
    if (!FIREBASE_READY || !uid || uid === "local-user") { setNotes([]); return; }
    const unsub = fbDb.collection("notes").where("ownerUid", "==", uid)
      .onSnapshot(snap => {
        const arr = [];
        snap.forEach(d => arr.push({id: d.id, ...d.data()}));
        arr.sort((a, b) => (noteTs(b) - noteTs(a)));
        setNotes(arr);
      }, err => console.warn("notes load:", err));
    return () => unsub();
  }, [user]);

  const noteApi = useMemo(() => {
    const uid = user && user.uid;
    const live = FIREBASE_READY && fbDb && uid && uid !== "local-user";
    return {
      live,
      create: async (patch) => {
        if (!live) return null;
        const now = Date.now();
        const ref = await fbDb.collection("notes").add({
          ownerUid: uid, title: "", blocks: [], bookId: null,
          visibility: "private", ts: now, createdAt: now, updatedAt: now, ...patch,
        });
        return ref.id;
      },
      update: async (id, patch) => {
        if (!live || !id) return;
        try { await fbDb.collection("notes").doc(id).update({...patch, updatedAt: Date.now()}); }
        catch (e) { console.warn("note update:", e); }
      },
      remove: async (id) => {
        if (!live || !id) return;
        try { await fbDb.collection("notes").doc(id).delete(); }
        catch (e) { console.warn("note delete:", e); }
      },
    };
  }, [user]);

  const setData = useCallback((d) => {
    setDataState(d);
    if (user) scheduleSave(user.uid, d);
  }, [user]);

  const handleLogin = (u) => {
    setUser(u);
    setProfile(loadProfileLocal());
    const d = loadLocal() || {...defaultData(), startDate:todayStr()};
    setDataState(d);
    setOpened(false);
  };

  // 새 책으로 시작 — 전부 지우고 고른 날짜를 DAY 1로
  const handleReset = useCallback(async (startDate) => {
    const fresh = {...defaultData(), startDate: startDate || todayStr()};
    setDataState(fresh);
    setOpened(false);
    try { await resetSave(user && user.uid, fresh); }
    catch (e) { console.warn("Reset save failed:", e); }
  }, [user]);

  // 책장에 내걸 숫자 — scashbook 문서는 본인만 읽을 수 있어서 남의 책장에선 못 본다.
  // 그래서 이미 공개로 열어 둔 users 문서에 이 셋만 따로 얹는다.
  // 챕터 제목도 같이 — 방문자의 Story Book 목차가 내 목차와 같은 이름을 부르도록.
  // 지도(map)가 아니라 목록으로 두는 건 merge 저장이 맵 안의 키를 지우지 않기 때문이다
  // (제목을 지웠는데 남의 책장엔 옛 제목이 남는 일을 막는다).
  useEffect(() => {
    if (!data || !user || !profile || !profile.handle) return;
    const t = setTimeout(() => {
      const start = data.startDate || todayStr();
      const day = Math.max(1, daysBetween(start, todayStr()));
      const page = data.pageCount || 0;
      const records = data.pageRecords || {};
      const cash = Object.values(records).reduce((sum, r) =>
        sum + ((r.tasks || []).filter(x => x.done && CASH_KEYS.indexOf(x.cat) >= 0).length), 0);

      // 나눈 하루가 있는 달의 제목만 내건다
      const shared = new Set(Object.keys(records)
        .filter(k => records[k] && records[k].published).map(k => k.slice(0, 7)));
      const chapters = [];
      Object.keys(data.chapters || {}).forEach(y => {
        const ms = data.chapters[y] || {};
        Object.keys(ms).forEach(m => {
          if (m === "tasks") return;                       // 연간 책 목록은 챕터가 아니다
          const title = ((ms[m] || {}).title || "").trim();
          if (!title) return;
          const key = y + "-" + String(m).padStart(2, "0");
          if (shared.has(key)) chapters.push({k: key, t: title});
        });
      });
      chapters.sort((a, b) => (a.k < b.k ? -1 : 1));

      const prev = profile.stats || {};
      const same = prev.day === day && prev.page === page && prev.cash === cash &&
        JSON.stringify(profile.chapters || []) === JSON.stringify(chapters);
      if (same) return;
      saveProfile(user.uid, profile, {stats: {day, page, cash}, chapters})
        .then(setProfile).catch(e => console.warn("stats:", e));
    }, 1500);
    return () => clearTimeout(t);
  }, [data, user, profile]);

  const handleSaveProfile = useCallback(async (patch) => {
    const next = await saveProfile(user && user.uid, profile, patch);
    setProfile(next);
    return next;
  }, [user, profile]);

  const handleLogout = async () => {
    if (!confirm("로그아웃 하시겠습니까?\n(데이터는 다음 로그인 시 복원됩니다)")) return;
    if (FIREBASE_READY && fbAuth.currentUser) {
      try { await fbAuth.signOut(); } catch(e) {}
    }
    localStorage.removeItem(LS_AUTH);
    setUser(null);
    setDataState(null);
    setProfile(null);
    setOpened(false);
  };

  if (loading) {
    return (
      <div style={{height:"100%",display:"flex",alignItems:"center",justifyContent:"center",background:"#1a0f08",color:"#d4a851",fontSize:"12px",letterSpacing:"2px",animation:"pulse 1.2s infinite"}}>
        Loading...
      </div>
    );
  }

  if (!user) return <LoginScreen onLogin={handleLogin}/>;
  if (!data) return <div style={{height:"100%",background:"#1a0f08"}}/>;

  // 이름을 적고 → 문으로 들어간다
  if (!(profile && profile.penName)) {
    return (
      <PenNamePlate
        mode="first"
        suggestion={(user.name && user.name !== "작가") ? user.name : ""}
        onSave={(patch)=>handleSaveProfile(patch)}
      />
    );
  }

  if (!opened) {
    return (
      <BookCover
        data={data}
        onStart={()=>setOpened(true)}
        onReset={handleReset}
      />
    );
  }

  return <PageBook data={data} setData={setData} onLogout={handleLogout} user={user}
    profile={profile} onSaveProfile={handleSaveProfile} notes={notes} noteApi={noteApi}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
</script>
</body>
</html>
