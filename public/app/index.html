<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CASH Room">
<meta name="theme-color" content="#3a2c1e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>CASH Room — 나의 인생 스토리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body,#root{height:100%}
  body{font-family:'Noto Sans KR',sans-serif;background:#1a0f08;overflow:hidden;color:#3a2818}
  input,textarea,select,button{font-family:inherit;outline:none;color:inherit}
  textarea{resize:vertical;font-family:'Noto Sans KR',sans-serif}

  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeOut{from{opacity:1}to{opacity:0}}
  @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#b8924a55;border-radius:2px}

  /* Paper textures */
  .paper{
    background:
      radial-gradient(circle at 20% 30%, rgba(237,226,197,.4) 0, transparent 60%),
      radial-gradient(circle at 80% 70%, rgba(232,220,181,.3) 0, transparent 60%),
      linear-gradient(#f5ecd9, #f1e6cf);
  }
  .paper-edge{
    box-shadow:
      inset 0 0 50px rgba(139,90,43,.10),
      0 0 0 1px rgba(139,90,43,.12),
      0 4px 14px rgba(0,0,0,.25);
  }
  .gold{color:#9c7a2a}
  .ink{color:#3a2818}

  .btn-gold{
    background:linear-gradient(135deg,#d4a851,#b8862f);
    color:#fff8e5;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(155,120,40,.4);
    transition:all .15s;
    letter-spacing:.5px;
  }
  .btn-gold:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(155,120,40,.55)}
  .btn-gold:active{transform:translateY(0);box-shadow:0 1px 3px rgba(155,120,40,.4)}
  .btn-gold:disabled{background:#d8c79a;cursor:not-allowed;box-shadow:none;transform:none}

  .input{
    width:100%;
    padding:10px 12px;
    background:rgba(255,253,245,.7);
    border:1px solid #d8c79a;
    border-radius:6px;
    color:#3a2818;
    font-size:14px;
    transition:border-color .15s,background .15s;
  }
  .input:focus{border-color:#b8862f;background:#fffdf5}
  .input::placeholder{color:#b89066}

  .heading-serif{font-family:'Noto Serif KR',serif}
  .heading-script{font-family:'Nanum Pen Script',cursive;line-height:1.2}
  .heading-latin{font-family:'Cormorant Garamond',serif;font-style:italic}

  .page-wrap{padding:14px 12px;min-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
  /* ===== PULLSTORY 시작 화면 — 문(Door) ===== */
  .pd-scene{position:absolute;inset:0;border-radius:12px;overflow:hidden;perspective:1500px;background:radial-gradient(ellipse at 50% 42%,#3a2614,#180d05 82%)}
  .pd-interior{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3%;text-align:center;padding:8%}
  .pd-halo{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(245,222,150,.4),rgba(212,168,81,.1) 46%,transparent 70%)}
  .pd-room{position:relative;width:88%;max-height:56%;object-fit:contain;opacity:0;transform:scale(.94);transition:opacity .55s ease .35s,transform .7s ease .35s;filter:drop-shadow(0 10px 26px rgba(0,0,0,.55))}
  .pd-scene.pd-open .pd-room{opacity:1;transform:scale(1)}
  .pd-msg{position:relative;opacity:0;transition:opacity .5s ease .6s;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .pd-scene.pd-open .pd-msg{opacity:1}
  .pd-casing{position:absolute;inset:0;padding:5% 5% 0;box-sizing:border-box}
  .pd-leaf{position:relative;width:100%;height:100%;transform-origin:right center;transform:rotateY(0);opacity:1;transition:transform 1.15s cubic-bezier(.5,.05,.35,1),opacity .35s ease .85s;border-radius:44% 44% 6% 6%/24% 24% 4% 4%;background:repeating-linear-gradient(92deg,rgba(0,0,0,.05) 0 2px,rgba(255,255,255,.015) 2px 3px,transparent 3px 11px),linear-gradient(96deg,#7c5930,#6a481f 45%,#5a3c1a);box-shadow:inset 0 0 0 3px #4a3115,inset 0 0 0 5px rgba(212,168,81,.3),0 14px 34px rgba(0,0,0,.55),-6px 0 18px rgba(0,0,0,.35);border:1px solid #33200e}
  .pd-scene.pd-open .pd-leaf{transform:rotateY(-116deg);opacity:0}
  .pd-leaf::before{content:"";position:absolute;inset:5%;border:1px solid rgba(212,168,81,.22);border-radius:40% 40% 4% 4%/22% 22% 3% 3%;pointer-events:none}
  .pd-window{position:absolute;top:8%;left:16%;width:68%;height:40%;border-radius:48% 48% 6% 6%/40% 40% 5% 5%;background:radial-gradient(ellipse at 50% 42%,#fbf2d8,#ecd399 48%,#cba25b 78%,#a67c3d);box-shadow:inset 0 0 22px rgba(120,80,30,.5),0 0 0 3px #4a3115,0 0 0 5px rgba(212,168,81,.4);overflow:hidden}
  .pd-window img{width:100%;height:100%;object-fit:cover;display:block}
  .pd-light{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.4),transparent 42%);pointer-events:none}
  .pd-plaque{position:absolute;top:51%;left:50%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 35%,#2c1c0d,#1a1006);border:2px solid #b8862f;border-radius:50%/46%;padding:8px 20px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 0 14px rgba(0,0,0,.6)}
  .pd-plaque b{display:block;font-family:'Cormorant Garamond',Georgia,serif;color:#e3b662;font-size:clamp(12px,3.6vw,15px);font-weight:700;letter-spacing:.1em;line-height:1.05}
  .pd-plaque i{position:absolute;top:-10px;height:11px;width:1.5px;background:#8a6a34}
  .pd-plaque i.l{left:30%;transform:rotate(14deg)}
  .pd-plaque i.r{right:30%;transform:rotate(-14deg)}
  .pd-knob{position:absolute;top:63%;left:9%;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#f4dca0,#c79445 55%,#7f571f);box-shadow:0 2px 5px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.25)}
  .pd-plate{position:absolute;bottom:9%;left:18%;width:64%;height:15%;border-radius:5px;background:linear-gradient(180deg,rgba(0,0,0,.16),rgba(0,0,0,.28));box-shadow:inset 0 0 0 2px #4a3115,inset 0 0 14px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}

  /* ===== Vision 페이지 — 비전보드 ===== */
  .vb-head{text-align:center;margin:2px 0 16px}
  .vb-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;color:#2f2109;font-weight:700;letter-spacing:.01em;line-height:1}
  .vb-desc{font-family:'Noto Serif KR',serif;font-size:12px;color:#7a5e34;margin-top:8px}
  .vb-board{border-radius:8px;padding:18px 13px 22px;border:8px solid #6a481f;background-color:#c6a373;background-image:radial-gradient(circle at 1px 1px,rgba(96,62,26,.24) 1px,transparent 0);background-size:7px 7px;box-shadow:inset 0 0 26px rgba(70,44,16,.4),0 6px 16px rgba(0,0,0,.3)}
  .vb-pin{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd9d3,#c6403a 60%,#7e211c);box-shadow:0 2px 4px rgba(0,0,0,.4);pointer-events:none}
  .vb-pin.g{background:radial-gradient(circle at 35% 30%,#f6e0a4,#c79445 60%,#7f571f)}
  .vb-card{position:relative;background:#fffdf5;border-radius:3px;box-shadow:0 7px 16px rgba(40,25,10,.28)}
  .vb-id{padding:16px 16px 13px;margin-bottom:20px;transform:rotate(-.6deg)}
  .vb-lbl{font-size:10px;letter-spacing:.2em;color:#b58a3e;text-transform:uppercase;text-align:center;margin-bottom:8px}
  .vb-hint{font-family:'Noto Serif KR',serif;font-size:10px;color:#a98b57;font-style:italic;text-align:center;margin-top:8px}
  .vb-cashlbl{text-align:center;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#5c3f1c;font-weight:700;margin:2px 0 4px}
  .vb-cashsub{text-align:center;font-family:'Noto Serif KR',serif;font-size:11px;color:#6f5127;margin:0 0 13px}
  .vb-cc{position:relative;background:#fffdf5;border-radius:3px;padding:12px 14px;box-shadow:0 6px 14px rgba(40,25,10,.25);margin-bottom:13px}
  .vb-cc:nth-child(odd){transform:rotate(-.5deg)} .vb-cc:nth-child(even){transform:rotate(.5deg)}
  .vb-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .vb-bdg{width:24px;height:24px;border-radius:5px;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;flex-shrink:0}
  .vb-nm{font-family:'Noto Serif KR',serif;font-size:13px;font-weight:700;color:#3a2818}
  .vb-nm .en{font-size:9px;color:#a08048;font-weight:400;letter-spacing:.06em;margin-left:6px}
  .vb-ta{width:100%;box-sizing:border-box;background:transparent;border:none;resize:none;outline:none;font-family:'Noto Serif KR',serif;font-size:13px;color:#3a2818;line-height:1.6;padding:2px 0}
  .vb-ta::placeholder{color:#c9b389}
  .vb-ta:focus{background:rgba(212,168,81,.09);border-radius:3px}
  .vb-id .vb-ta{text-align:center;font-size:16px;font-weight:700;color:#2e2013;line-height:1.55}
  .vb-gallery{display:flex;justify-content:center;margin-top:2px}
  .vb-polaroid{position:relative;background:#fffef9;padding:9px 9px 20px;box-shadow:0 8px 18px rgba(40,25,10,.3);transform:rotate(1.6deg);cursor:pointer}
  .vb-pic{width:150px;height:132px;border-radius:2px;background:linear-gradient(135deg,#8a6730,#5a3f1c);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#e8cf95;font-size:26px}
  .vb-capn{text-align:center;font-size:15px;color:#5c3f1c;margin-top:7px}

  /* ===== Shelf 페이지 — 책장 ===== */
  .sf-head{text-align:center;margin-bottom:15px}
  .sf-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;color:#2f2109;font-weight:700;line-height:1}
  .sf-desc{font-family:'Noto Serif KR',serif;font-size:12px;color:#7a5e34;margin-top:7px}
  .sf-case{border:9px solid #5c3d18;border-radius:6px;background:#2a1c0f;box-shadow:0 8px 22px rgba(0,0,0,.4),inset 0 0 0 2px rgba(0,0,0,.4)}
  .sf-shelf{position:relative}
  .sf-int{position:relative;background:#241a10;padding:11px 9px 12px;display:flex;align-items:flex-end;gap:7px;overflow:hidden}
  .sf-plank{height:11px;background:linear-gradient(180deg,#9a6528,#6a441f);box-shadow:0 4px 7px rgba(0,0,0,.45)}
  .sf-spark{position:absolute;color:#e8c877;font-size:8px;opacity:.55;pointer-events:none}
  .sf-letter{width:42px;height:58px;border-radius:2px;color:#fff8e5;font-family:Georgia,serif;font-weight:700;font-size:29px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.45);flex-shrink:0}
  .sf-cblock{padding:0 12px;min-height:58px;border-radius:2px;background:linear-gradient(180deg,#d8a63f,#b8862f);color:#3a2610;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:22px;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.45);flex-shrink:0}
  .sf-spines{display:flex;align-items:flex-end;gap:3px;flex-shrink:0}
  .sf-sp{border-radius:1px;box-shadow:0 3px 6px rgba(0,0,0,.35);position:relative}
  .sf-sp .d{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:rgba(255,240,190,.55)}
  .sf-sp .dm{position:absolute;left:50%;top:8px;transform:translate(-50%,0) rotate(45deg);width:5px;height:5px;background:rgba(255,240,190,.5)}
  .sf-note{flex:1;min-width:0;align-self:stretch;background:#fffdf5;border-radius:2px;padding:9px 11px;box-shadow:0 4px 11px rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:center}
  .sf-nl{font-family:'Noto Serif KR',serif;font-size:11px;font-weight:700;margin-bottom:4px}
  .sf-nl .en{font-size:8px;color:#a08048;margin-left:5px;font-weight:400;letter-spacing:.05em}
  .sf-ta{width:100%;box-sizing:border-box;background:transparent;border:none;resize:none;outline:none;overflow:hidden;font-family:'Noto Serif KR',serif;font-size:12.5px;color:#3a2818;line-height:1.55;padding:0;display:block}
  .sf-ta::placeholder{color:#c9b389}

  /* ===== Books 페이지 — My Books ===== */
  .mb-ovbox{border:8px solid #5c3d18;border-radius:6px;background:#241a10;box-shadow:0 7px 18px rgba(0,0,0,.4);overflow:hidden;margin-bottom:18px}
  .mb-ovtop{display:flex;align-items:center;justify-content:space-between;padding:6px 11px;background:linear-gradient(180deg,#6a441f,#4e3417);color:#e8c877}
  .mb-ynav{display:flex;align-items:center;gap:7px}
  .mb-ynav button{background:none;border:none;color:#caa869;font-size:18px;cursor:pointer;padding:0 3px;line-height:1;font-family:Georgia,serif}
  .mb-ynav button:disabled{opacity:.3;cursor:default}
  .mb-ynav b{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:16px;letter-spacing:.08em;color:#e8c877}
  .mb-ovt{font-family:'Noto Serif KR',serif;font-size:11px;color:#d3ac6a}
  .mb-ovgrid{display:grid;grid-template-columns:1fr 1fr}
  .mb-ovcell{position:relative;padding:9px 10px 10px;display:flex;align-items:flex-end;gap:6px;min-height:56px;border-bottom:5px solid #6a441f}
  .mb-ovcell:nth-child(odd){border-right:4px solid #4e3417}
  .mb-ovcell:nth-child(n+3){border-bottom:none}
  .mb-ovL{font-family:Georgia,serif;font-weight:700;font-size:26px;line-height:.9;flex-shrink:0;text-shadow:0 2px 3px rgba(0,0,0,.5)}
  .mb-ovsp{display:flex;align-items:flex-end;gap:2px}
  .mb-ovsp i{border-radius:1px;display:block}
  .mb-ovn{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:#e6cd94;line-height:1}
  .mb-ovn em{font-style:normal;color:#8a6a3a}
  .mb-ovn small{font-family:'Noto Serif KR',serif;font-size:9px;color:#c9a56a;margin-left:1px;font-weight:400}
  .mb-nb{background:#fffdf5;border-radius:6px;padding:13px;box-shadow:0 5px 14px rgba(40,25,10,.22);margin-bottom:18px;border-top:3px solid #b8862f}
  .mb-nbl{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;font-weight:700;color:#2f2109}
  .mb-nbd{font-family:'Noto Serif KR',serif;font-size:11px;color:#8a6d3c;margin:2px 0 11px}
  .mb-nbi{width:100%;box-sizing:border-box;border:1px solid #d8c79a;border-radius:6px;background:rgba(255,253,245,.8);padding:9px 11px;font-family:'Noto Serif KR',serif;font-size:13px;color:#3a2818;margin-bottom:9px}
  .mb-nbrow{display:flex;align-items:center;gap:7px;margin-bottom:11px;flex-wrap:wrap}
  .mb-chip{width:26px;height:26px;border-radius:6px;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.2);cursor:pointer}
  .mb-chip.off{opacity:.32}
  .mb-tsel{margin-left:auto;display:flex;border:1px solid #d8c79a;border-radius:7px;overflow:hidden}
  .mb-tsel span{padding:6px 9px;font-family:'Noto Serif KR',serif;font-size:11px;color:#9c7a2a;cursor:pointer}
  .mb-tsel span.on{background:#e9d7ad;color:#5c3f1c;font-weight:700}
  .mb-addb{width:100%;padding:11px;border:none;border-radius:7px;background:linear-gradient(135deg,#e7c574,#b8862f);color:#fff8e5;font-family:'Noto Serif KR',serif;font-weight:700;font-size:13px;letter-spacing:.2em;cursor:pointer}
  .mb-shelflbl{font-family:'Noto Serif KR',serif;font-size:12px;color:#5c3f1c;font-weight:700;margin:2px 2px 11px}
  .mb-covers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mb-cover{position:relative;aspect-ratio:3/4.2;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:0 8px 16px rgba(0,0,0,.32);display:flex;cursor:pointer}
  .mb-cspine{width:9px;flex-shrink:0}
  .mb-cin{flex:1;position:relative;padding:14px 12px;display:flex;flex-direction:column}
  .mb-cfr{position:absolute;inset:8px;border:1px solid rgba(255,248,220,.4);border-radius:3px;pointer-events:none}
  .mb-ctype{font-family:'Noto Serif KR',serif;font-size:9px;font-weight:700;letter-spacing:.08em;color:rgba(255,248,220,.85)}
  .mb-cttl{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:#fff8e5;line-height:1.4;margin-top:auto;text-shadow:0 1px 4px rgba(0,0,0,.4)}
  .mb-cst{font-family:'Cormorant Garamond',serif;font-size:10px;font-style:italic;color:rgba(255,248,220,.75);margin-top:6px}
  .mb-ov{position:fixed;inset:0;z-index:10000;background:rgba(20,12,5,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 12px;box-sizing:border-box;animation:fadeIn .2s}
  .mb-page{width:100%;max-width:400px;border-radius:9px;background:#f3e9d1;background-image:radial-gradient(circle at 60% 0%,#f8f1de,#eaddbf 75%);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .mb-dbar{display:flex;align-items:center;justify-content:space-between;padding:12px 13px 10px}
  .mb-back{background:none;border:none;color:#8a6a3a;font-family:'Noto Serif KR',serif;font-size:12px;font-weight:700;cursor:pointer}
  .mb-pill{border:none;font-family:'Noto Serif KR',serif;font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;background:rgba(212,168,81,.18);color:#9c7a2a;cursor:pointer}
  .mb-dhead{display:flex;align-items:center;gap:11px;padding:4px 15px 14px;border-bottom:1px solid rgba(120,90,40,.18);margin-bottom:14px}
  .mb-mini{width:34px;height:46px;border-radius:2px 3px 3px 2px;display:flex;flex-shrink:0;box-shadow:0 4px 9px rgba(0,0,0,.25);overflow:hidden}
  .mb-mspine{width:6px}
  .mb-mbody{flex:1;display:flex;align-items:center;justify-content:center;color:#fff8e5;font-family:Georgia,serif;font-weight:700;font-size:17px}
  .mb-dtitle{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;color:#2e2013;line-height:1.3}
  .mb-dmeta{font-family:'Noto Serif KR',serif;font-size:10px;color:#a0824a;margin-top:4px}
  .mb-dpad{padding:0 15px 16px}
  .mb-g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
  .mb-fld{min-width:0}
  .mb-fl{font-family:'Noto Serif KR',serif;font-size:9px;font-weight:700;color:#9c7f4e;margin-bottom:4px}
  .mb-callbl{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 7px;font-family:'Noto Serif KR',serif;font-size:10px;font-weight:700;color:#9c7f4e}
  .mb-callbl b{font-weight:700}
  .mb-cal{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}
  .mb-cell{aspect-ratio:1;border-radius:3px;font-size:8px;font-weight:700;background:rgba(245,236,217,.8);border:1px solid #ddcb9f;color:#a08a5e;font-family:Georgia,serif;cursor:default;padding:0}
  .mb-cell.on{background:#5a8c4a;border-color:#4a7c3a;color:#fff}
  .mb-bar{height:5px;background:#e8dcb5;border-radius:3px;overflow:hidden;margin-top:9px}
  .mb-bar span{display:block;height:100%;background:linear-gradient(90deg,#5a8c4a,#4a7c3a);border-radius:3px}
  .mb-foot{display:flex;gap:9px;margin-top:16px}
  .mb-fbtn{flex:1;padding:10px;border-radius:7px;font-family:'Noto Serif KR',serif;font-size:12px;font-weight:700;text-align:center;cursor:pointer;border:none}

<script type="text/babel" data-presets="env,react">
const {useState, useEffect, useRef, useCallback, useMemo} = React;

// ═════════════════════════════════════════════════════════════════════
// 🔧 FIREBASE 설정 — 본인의 Firebase 프로젝트 키로 교체하세요.

// ═════════════════════════════════════════════════════════════════════
// CASH 프레임워크 상수
// ═════════════════════════════════════════════════════════════════════
const CC = {C:"#c97a3a", A:"#b85450", S:"#4a7ba8", H:"#5a8c4a", L:"#6e5a8c"};
const CL = {C:"Content", A:"Attitude", S:"Social", H:"Health", L:"Life"};
const CK = {C:"전문성", A:"태도", S:"관계", H:"건강", L:"인생"};
const CD = {
  C:"내가 쌓아가는 지식·기술·역량",
  A:"마인드셋, 감사, 확언, 내면 상태",
  S:"인간관계, 네트워크, 사회적 신용",
  H:"신체·정신 건강, 에너지 관리"
};
const CASH_KEYS = ["C","A","S","H"];
// Today 페이지 색 — 재디자인 팔레트(BC)와 동일. COL=테두리/채움, INK=크림 종이 위 글자
// L(Life)은 선택지에서 뺐지만, 이미 만들어둔 L 에피소드가 제 색으로 남도록 항목은 유지
const EP_COL = {C:"#c8901f", A:"#b23f39", S:"#3d6fa0", H:"#46834a", L:"#6e5a8c"};
const EP_INK = {C:"#9c7420", A:"#b23f39", S:"#3d6fa0", H:"#46834a", L:"#6e5a8c"};

// 표지 이미지 분류 카테고리: CASH + Life (인생 전반)
const CAT_KEYS = ["C","A","S","H","Life"];
const CAT_COLOR = {C:"#c97a3a", A:"#b85450", S:"#4a7ba8", H:"#5a8c4a", Life:"#d4a851"};
const CAT_LABEL = {C:"전문성", A:"태도", S:"관계", H:"건강", Life:"인생"};

// visionImages 정규화: 레거시(문자열) → {img, cat:null}
function normImg(e) {
  if (typeof e === "string") return {img: e, cat: null};
  if (e && typeof e === "object" && "img" in e) return e;
  return {img: "", cat: null};
}

// ═════════════════════════════════════════════════════════════════════
// 데이터 모델
// ═════════════════════════════════════════════════════════════════════
function defaultData() {
  return {
    bookTitle: "",
    bookCover: "",
    bookPrice: "",
    identity: "",
    visionCash: {C:"", A:"", S:"", H:""},
    visionImages: [],
    yearMain: "",
    yearPrice: "",
    yearCash: {C:"", A:"", S:"", H:""},
    todayTasks: {C:[], A:[], S:[], H:[]},
    chapters: {}, // {"2026": {"1": {cashPower:{target:"",done:false}, tasks:[{id,cat,type,text,status}]}, ...}}
    pageRecords: {},
    pageCount: 0,
    startDate: ""
  };
}

function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

// 두 날짜(YYYY-MM-DD) 사이의 일수 — 같은 날이면 1 (양 끝 포함)
function daysBetween(fromK, toK) {
  if (!fromK || !toK) return 0;
  const a = new Date(fromK + "T00:00:00"), b = new Date(toK + "T00:00:00");
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return 0;
  return Math.floor((b - a) / 86400000) + 1;
}

// 날짜 키에 n일 더하기 (1일차 = start)
function dayKeyOf(startK, day) {
  if (!startK) return "";
  const d = new Date(startK + "T00:00:00");
  if (isNaN(d.getTime())) return "";
  d.setDate(d.getDate() + (day - 1));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

// 그날이 '완성된 페이지'인지.
// 자정 처리가 pageEarned를 붙인다(옛 기록은 completed). 아직 처리 안 된 오늘은
// 그날 적은 걸 다 끝냈는지로 직접 판단한다.
function isPageDone(r) {
  if (!r) return false;
  if (r.pageEarned || r.completed) return true;
  if (r.processed) return false;          // 자정에 미완으로 판정된 날
  const ts = r.tasks || [];
  return ts.length > 0 && ts.every(t => t.done);
}

// 책의 표 범위 — 습관은 시작일+목표기간, 성취는 시작일+데드라인
function bookSpan(book) {
  if (!book) return {key:"habit", start:"", duration:0};
  if (taskTypeOf(book) === "habit") {
    const h = book.habit || {};
    return {key:"habit", start: h.start || "", duration: parseInt(h.duration) || 30};
  }
  const a = book.ach || {};
  return {key:"ach", start: a.start || "", duration: Math.max(0, daysBetween(a.start, a.deadline))};
}

// 사진 압축 → base64
// stamp=true면 필름 카메라식 날짜 각인(찍은 시각)을 픽셀에 직접 그려 넣는다 — 인증 사진용
function compressPhoto(file, maxW=720, quality=0.7, stamp=false) {
  return new Promise((res) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        const ratio = Math.min(maxW/img.width, maxW/img.height, 1);
        c.width = Math.round(img.width*ratio);
        c.height = Math.round(img.height*ratio);
        const ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0, c.width, c.height);
        if (stamp) drawDateStamp(ctx, c.width, c.height);
        res(c.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// 90년대 필름 카메라 날짜 각인 (우측 하단, 주황 글로우) — "2026 07 30  14:05"
function drawDateStamp(ctx, w, h) {
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  const txt = `${d.getFullYear()} ${p(d.getMonth()+1)} ${p(d.getDate())}  ${p(d.getHours())}:${p(d.getMinutes())}`;
  // 짧은 변 기준 — 세로 사진에서 각인만 커지지 않도록
  const s = Math.max(11, Math.round(Math.min(w, h) * 0.062));
  ctx.save();
  ctx.font = `700 ${s}px 'Courier New', Courier, monospace`;
  ctx.textAlign = "right";
  ctx.textBaseline = "alphabetic";
  const x = w - s*0.75, y = h - s*0.75;
  // ① 어두운 그림자 — 밝은 사진에서도 묻히지 않게
  ctx.shadowColor = "rgba(0,0,0,.6)";
  ctx.shadowBlur = s*0.55;
  ctx.fillStyle = "rgba(255,140,26,.92)";
  ctx.fillText(txt, x, y);
  // ② 주황 글로우 ③ 밝은 심지
  ctx.shadowColor = "rgba(255,120,0,.85)";
  ctx.shadowBlur = s*0.5;
  ctx.fillStyle = "#ff8c1a";
  ctx.fillText(txt, x, y);
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#ffb968";
  ctx.fillText(txt, x, y);
  ctx.restore();
}

// ═════════════════════════════════════════════════════════════════════
// 저장소 레이어 (Firestore + localStorage 폴백)
// ═════════════════════════════════════════════════════════════════════
const LS_KEY = "scashbook_data";
const LS_AUTH = "scashbook_local_user";
const LS_PROFILE = "pullstory_profile";

function loadLocal() {
  try { const d = localStorage.getItem(LS_KEY); return d ? JSON.parse(d) : null; }
  catch(e) { return null; }
}
function saveLocal(d) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch(e) {}
}

let saveTimer = null;
function scheduleSave(uid, data) {
  saveLocal(data);
  if (!FIREBASE_READY || !uid || uid === "local-user") return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    fbDb.collection("scashbook").doc(uid).set(data, {merge:true}).catch(e => console.warn("Save failed:", e));
  }, 800);
}

// 초기화 전용 저장 — merge 없이 통째로 덮어써야 서버의 옛 기록까지 지워진다.
// (set(...,{merge:true})는 pageRecords·chapters 같은 맵 안의 키를 지우지 않아서
//  다른 기기에서 열거나 다시 로그인하면 옛 기록이 되살아난다)
async function resetSave(uid, data) {
  clearTimeout(saveTimer);   // 예약된 merge 저장이 뒤늦게 옛 데이터를 되살리지 못하게
  saveLocal(data);
  if (!FIREBASE_READY || !uid || uid === "local-user") return;
  await fbDb.collection("scashbook").doc(uid).set(data);
}

// ── 사진 저장소 ──────────────────────────────────────────────
// Firestore 문서 하나당 사진 한 장. 문서마다 1MB 한도를 따로 쓰기 때문에
// 사진을 본 문서에 넣던 방식과 달리 장수 제한이 사실상 사라진다.
const photoCache = new Map();   // photoId → dataURI (세션 동안 재요청 안 하게)

async function savePhoto(uid, dataUri) {
  if (!dataUri) return null;
  if (!FIREBASE_READY || !uid || uid === "local-user") return {inline: dataUri};
  try {
    const ref = fbDb.collection("photos").doc();
    await ref.set({ownerUid: uid, data: dataUri, visibility: "private", createdAt: Date.now()});
    photoCache.set(ref.id, dataUri);
    return {id: ref.id};
  } catch (e) {
    console.warn("Photo save failed:", e);
    return {inline: dataUri};   // 실패해도 기록은 남게 — 예전처럼 본문에 담는다
  }
}

async function loadPhoto(id) {
  if (!id) return null;
  if (photoCache.has(id)) return photoCache.get(id);
  if (!FIREBASE_READY) return null;
  try {
    const snap = await fbDb.collection("photos").doc(id).get();
    const d = snap.exists ? (snap.data().data || null) : null;
    if (d) photoCache.set(id, d);
    return d;
  } catch (e) { console.warn("Photo load failed:", e); return null; }
}

// 글 정렬 기준 — 새 글은 숫자 ts, 옛 노트는 serverTimestamp
function noteTs(n) {
  if (!n) return 0;
  if (typeof n.ts === "number") return n.ts;
  const c = n.createdAt;
  if (c && typeof c.seconds === "number") return c.seconds * 1000;
  return 0;
}

// 글 본문 → 블록. 옛 글은 body 문자열, 새 글은 blocks 배열
function noteBlocks(n) {
  if (n && Array.isArray(n.blocks)) return n.blocks;
  const out = [];
  String((n && n.body) || "").split(/(\[\[q:\d{4}-\d{2}-\d{2}\]\])/g).forEach(seg => {
    const m = seg.match(/^\[\[q:(\d{4}-\d{2}-\d{2})\]\]$/);
    if (m) out.push({t: "q", d: m[1]});
    else { const v = seg.replace(/^\n+|\n+$/g, ""); if (v) out.push({t: "p", v}); }
  });
  if (!out.length || out[out.length - 1].t !== "p") out.push({t: "p", v: ""});
  return out;
}

function noteIsEmpty(n) {
  if (((n && n.title) || "").trim()) return false;
  return !noteBlocks(n).some(b => b.t === "q" || String(b.v || "").trim());
}

// ── 하루 한 장 내보내기 ──────────────────────────────────────
// publicPages = 그 하루 전체(방문자가 열어 보는 것) · feed = 진열대 카드 한 장.
// 원본 기록은 그대로 두고 사본만 만든다. 내리면 사본만 지운다.
// 문서 id를 책장 주소로 만든다 — 주소는 영구·고유라 /p/{handle}/{date} 가 그대로 풀린다
function pubIdOf(handle, date) { return handle + "_" + date; }

async function setPhotosVisibility(ids, vis) {
  if (!FIREBASE_READY) return;
  const uniq = Array.from(new Set((ids || []).filter(Boolean)));
  await Promise.all(uniq.map(id =>
    fbDb.collection("photos").doc(id).set({visibility: vis}, {merge: true})
      .catch(e => console.warn("photo visibility:", e))
  ));
}

// 그날 완료한 에피소드를 시각 순으로
function dayEpisodes(rec) {
  return ((rec && rec.tasks) || []).filter(t => t.done)
    .slice().sort((a, b) => (a.doneAt || a.id || 0) - (b.doneAt || b.id || 0));
}

// Key Scene — 고른 게 없으면 사진 있는 첫 에피소드로
function keyEpisodeOf(rec) {
  const eps = dayEpisodes(rec);
  const picked = eps.find(t => t.id === (rec && rec.keyScene));
  return picked || eps.find(t => t.photo || t.photoId) || eps[0] || null;
}

async function publishDay(uid, profile, date, rec) {
  const eps = dayEpisodes(rec);
  const key = keyEpisodeOf(rec);
  const caption = ((rec && rec.caption) || "").trim();
  const now = Date.now();
  const common = {
    ownerUid: uid,
    handle: (profile && profile.handle) || "",
    penName: (profile && profile.penName) || "",
    date, caption,
    keyPhotoId: (key && key.photoId) || null,
    visibility: "public",
    publishedAt: now,
  };
  if (!FIREBASE_READY || !uid || uid === "local-user" || !common.handle) return;
  const id = pubIdOf(common.handle, date);
  // 하루 전체 — 메모까지 담는다(들어와서 보는 사람에겐 보여야 하니까)
  await fbDb.collection("publicPages").doc(id).set({
    ...common,
    episodes: eps.map(t => ({
      cat: t.cat || "C", text: t.text || "", doneAt: t.doneAt || null,
      photoId: t.photoId || null, memo: t.memo || "",
    })),
  });
  // 진열대 카드 — 목록을 그리는 데 필요한 것만. 메모는 넣지 않는다
  await fbDb.collection("feed").doc(id).set({
    ...common,
    kind: "page",
    titles: eps.map(t => t.text || "").slice(0, 6),
    count: eps.length,
  });
  await setPhotosVisibility(eps.map(t => t.photoId), "public");
}

async function unpublishDay(uid, handle, date, rec) {
  if (!FIREBASE_READY || !uid || uid === "local-user" || !handle) return;
  const id = pubIdOf(handle, date);
  await fbDb.collection("publicPages").doc(id).delete().catch(e => console.warn("unpublish:", e));
  await fbDb.collection("feed").doc(id).delete().catch(e => console.warn("unpublish:", e));
  await setPhotosVisibility(dayEpisodes(rec).map(t => t.photoId), "private");
}

// ── 책 내보내기 ──────────────────────────────────────────────
// 성취 = D-DAY 지남 + 표 60% + 글 2편 · 습관 = 표 70% + 글 2편
const BOOK_MIN_POSTS = 2;

// 이 책에 묶인 글 — 글은 전부 notes에 살고 bookId로 소속만 표시한다.
// (book.posts는 옛 저장 방식. 아직 이관 전인 책을 위해 뒤에 붙여 둔다)
function bookPosts(book, notes) {
  const mine = (notes || []).filter(n => String(n.bookId) === String(book.id));
  const src = mine.length ? mine : (book.posts || []);
  return src.filter(p => !noteIsEmpty(p)).slice().sort((a, b) => noteTs(a) - noteTs(b));
}

function bookPublishChecks(book, notes) {
  // 묶음 책은 표도 데드라인도 없다 — 기준 없이 바로 내보낼 수 있다
  if (book.type === "collection") return {checks: [], ok: true};
  const isHabit = taskTypeOf(book) === "habit";
  const span = bookSpan(book);
  const dur = span.duration;
  const filled = new Set(((book[span.key] || {}).done) || []).size;
  const pct = dur ? Math.round(filled / dur * 100) : 0;
  const needPct = isHabit ? 70 : 60;
  const posts = bookPosts(book, notes).length;
  const checks = [];

  if (!isHabit) {
    const dl = (book.ach || {}).deadline || "";
    const passed = dl ? daysBetween(dl, todayStr()) >= 2 : false;   // 데드라인 다음 날부터
    checks.push({ok: passed,
      text: dl ? (passed ? `D-DAY가 지났습니다 (${dl})` : `D-DAY가 지나야 합니다 (${dl})`)
               : "데드라인을 먼저 정해 주세요"});
  }
  checks.push({ok: pct >= needPct,
    text: `${isHabit ? "습관 일정표" : "D-DAY 표"}를 ${needPct}% 이상 — 현재 ${pct}%`});
  checks.push({ok: posts >= BOOK_MIN_POSTS,
    text: posts >= BOOK_MIN_POSTS
      ? `Write에 글 ${BOOK_MIN_POSTS}편 이상 — 현재 ${posts}편`
      : `Write에 글 ${BOOK_MIN_POSTS}편 이상 — 현재 ${posts}편, ${BOOK_MIN_POSTS - posts}편 더 필요합니다`});

  return {checks, ok: checks.every(c => c.ok)};
}

// 글 안의 인용은 원본 기록을 가리키고 있다 → 내보낼 땐 그 자리에서 풀어 담는다
function resolvePostForPublic(book, post, records, span) {
  const blocks = noteBlocks(post);
  const photoIds = [];
  const resolved = blocks.map(b => {
    if (b.t !== "q") return {t: "p", v: String(b.v || "")};
    const rec = (records || {})[b.d];
    const t = rec && (rec.tasks || []).find(x => x.done && x.sourceTaskId === book.id);
    if (!t) return {t: "p", v: ""};
    if (t.photoId) photoIds.push(t.photoId);
    return {t: "q", d: b.d, day: span.start ? daysBetween(span.start, b.d) : 0,
            photoId: t.photoId || null, memo: t.memo || ""};
  }).filter(b => b.t === "q" || b.v.trim());

  return {block: {id: post.id, title: post.title || "", blocks: resolved, ts: noteTs(post) || null}, photoIds};
}

async function publishBook(uid, profile, book, records, notes) {
  const handle = (profile && profile.handle) || "";
  if (!FIREBASE_READY || !uid || uid === "local-user" || !handle) return;
  const isColl = book.type === "collection";
  const isHabit = taskTypeOf(book) === "habit";
  const span = bookSpan(book);
  const sub = book[span.key] || {};
  const posts = bookPosts(book, notes);

  const photoIds = [];
  const pubPosts = posts.map(p => {
    const r = resolvePostForPublic(book, p, records, span);
    photoIds.push(...r.photoIds);
    return r.block;
  });

  const id = handle + "_b" + book.id;
  const now = Date.now();
  const common = {
    ownerUid: uid, handle, penName: (profile && profile.penName) || "",
    bookId: String(book.id), title: book.text || "", cat: book.cat || "C",
    type: isColl ? "collection" : isHabit ? "habit" : "achievement",
    visibility: "public", publishedAt: now,
  };

  // 묶음 책은 표가 없다 — 소개 한 편이 그 자리를 대신한다
  await fbDb.collection("publicBooks").doc(id).set({
    ...common,
    start: isColl ? "" : (span.start || ""),
    duration: isColl ? 0 : (span.duration || 0),
    done: isColl ? [] : (sub.done || []).slice(),
    info: isColl
      ? {intro: book.intro || ""}
      : isHabit
      ? {freq: sub.freq || "", time: sub.time || ""}
      : {criteria: (book.ach || {}).criteria || "", deadline: (book.ach || {}).deadline || "",
         steps: (book.ach || {}).steps || ""},
    posts: pubPosts,
  });

  await fbDb.collection("feed").doc(id).set({
    ...common, kind: "book",
    keyPhotoId: photoIds[0] || null,
    postCount: pubPosts.length,
    filled: isColl ? 0 : (sub.done || []).length,
    total: isColl ? 0 : (span.duration || 0),
  });

  // 책 안의 글도 각자 진열대에 오른다 — 읽고 나서 그 책으로 건너갈 수 있게
  await Promise.all(pubPosts.map(p => publishNote(uid, profile, p, book)));
  await pruneBookNoteCards(handle, book.id, pubPosts.map(p => p.id));

  await setPhotosVisibility(photoIds, "public");
}

// 글도 진열대에 오른다 — 원본은 notes에 그대로 있고 카드만 만든다.
// 책에 묶인 글이면 어느 책에서 왔는지 카드에 적어 둔다(읽는 사람이 그 책으로 건너갈 수 있게).
async function publishNote(uid, profile, note, book) {
  const handle = (profile && profile.handle) || "";
  if (!FIREBASE_READY || !uid || uid === "local-user" || !handle) return;
  const text = noteBlocks(note).filter(b => b.t === "p").map(b => b.v).join("\n").trim();
  await fbDb.collection("feed").doc(handle + "_n" + note.id).set({
    kind: "note", ownerUid: uid, handle, penName: (profile && profile.penName) || "",
    noteId: String(note.id), title: note.title || "",
    excerpt: text.slice(0, 120),
    bookId: book ? String(book.id) : null,
    bookTitle: book ? (book.text || "") : null,
    visibility: "public", publishedAt: noteTs(note) || Date.now(),
  });
}

async function unpublishNote(uid, handle, noteId) {
  if (!FIREBASE_READY || !uid || uid === "local-user" || !handle) return;
  await fbDb.collection("feed").doc(handle + "_n" + noteId).delete()
    .catch(e => console.warn("unpublish note:", e));
}

// 이 책에서 나온 글 카드들 — keep에 없는 것은 거둬들인다(책에서 풀렸거나 지워진 글)
async function pruneBookNoteCards(handle, bookId, keep) {
  if (!FIREBASE_READY || !handle) return;
  try {
    const snap = await fbDb.collection("feed")
      .where("handle", "==", handle).where("kind", "==", "note")
      .where("bookId", "==", String(bookId)).get();
    const alive = new Set((keep || []).map(String));
    await Promise.all(snap.docs
      .filter(d => !alive.has(String(d.data().noteId)))
      .map(d => d.ref.delete().catch(e => console.warn("prune note card:", e))));
  } catch (e) { console.warn("prune note cards:", e); }
}

async function unpublishBook(uid, handle, book) {
  if (!FIREBASE_READY || !uid || uid === "local-user" || !handle) return;
  const id = handle + "_b" + book.id;
  await fbDb.collection("publicBooks").doc(id).delete().catch(e => console.warn("unpublish book:", e));
  await fbDb.collection("feed").doc(id).delete().catch(e => console.warn("unpublish book:", e));
  await pruneBookNoteCards(handle, book.id, []);
}

// ── 지은이 (필명 · 책장 주소) ────────────────────────────────
// data와 따로 users/{uid}에 둔다 — '새 책으로 시작하기'로 지워지면 안 되니까.
// 책은 새로 시작해도 쓰는 사람은 그대로다.
function loadProfileLocal() {
  try { const d = localStorage.getItem(LS_PROFILE); return d ? JSON.parse(d) : null; }
  catch (e) { return null; }
}

async function loadProfile(uid) {
  const local = loadProfileLocal();
  if (!FIREBASE_READY || !uid || uid === "local-user") return local;
  try {
    const snap = await fbDb.collection("users").doc(uid).get();
    if (snap.exists) {
      const p = snap.data();
      try { localStorage.setItem(LS_PROFILE, JSON.stringify(p)); } catch (e) {}
      return p;
    }
  } catch (e) { console.warn("Profile load failed:", e); }
  return local;
}

async function saveProfile(uid, prev, patch) {
  const next = {...(prev || {}), ...patch, updatedAt: Date.now()};
  try { localStorage.setItem(LS_PROFILE, JSON.stringify(next)); } catch (e) {}
  if (FIREBASE_READY && uid && uid !== "local-user") {
    try { await fbDb.collection("users").doc(uid).set(next, {merge: true}); }
    catch (e) { console.warn("Profile save failed:", e); }
  }
  return next;
}

// ── 책장 주소 (handle) ───────────────────────────────────────
// handles/{주소} 문서를 만들어 선착순을 보장한다. 이미 있으면 create가 거부되므로
// 두 사람이 같은 순간에 같은 주소를 잡는 일이 생기지 않는다.
const HANDLE_RE = /^[a-z0-9_]{3,20}$/;
const HANDLE_RESERVED = ["admin","root","api","null","undefined","pullstory","cashroom","help","support"];

function handleError(h) {
  if (!h) return "";
  if (h.length < 3) return "세 글자 이상이어야 해요";
  if (h.length > 20) return "스무 글자를 넘을 수 없어요";
  if (!HANDLE_RE.test(h)) return "영문 소문자 · 숫자 · _ 만 쓸 수 있어요";
  if (HANDLE_RESERVED.indexOf(h) >= 0) return "쓸 수 없는 주소예요";
  return "";
}

async function isHandleFree(h) {
  if (!FIREBASE_READY) return true;
  try {
    const snap = await fbDb.collection("handles").doc(h).get();
    return !snap.exists;
  } catch (e) { console.warn("handle check:", e); return true; }
}

// 비어 있는 주소 하나 제안 — 이미 찬 주소를 권하지 않도록 실제로 확인한다
async function suggestHandle(h) {
  for (const cand of [h + "_1", h + "2", h + "_hw"]) {
    if (handleError(cand)) continue;
    if (await isHandleFree(cand)) return cand;
  }
  return "";
}

async function claimHandle(uid, h) {
  if (!FIREBASE_READY || !uid || uid === "local-user") return true;
  // 이미 있는 문서면 create가 아니라 update가 되어 규칙에 막힌다 → 선착순
  await fbDb.collection("handles").doc(h).set({uid, createdAt: Date.now()});
  return true;
}

async function loadRemote(uid) {
  if (!FIREBASE_READY || !uid) return null;
  try {
    const snap = await fbDb.collection("scashbook").doc(uid).get();
    return snap.exists ? snap.data() : null;
  } catch(e) { console.warn("Load failed:", e); return null; }
}

                  <div className="n">이 날이 DAY 1이 됩니다 · 이전 날짜는 달력에서 잠깁니다</div>
                </div>
                <div className="rs-acts">
                  <button className="rs-cancel" onClick={closeReset}>그만두기</button>
                  <button className="rs-go" disabled={!resetDate} onClick={()=>setResetStep(2)}>다음</button>
                </div>
              </div>
            ) : (
              <div>
                <div className="rs-big">정말 지울까요?</div>
                <div className="rs-sm">
                  <b>{lostPages}개의 페이지</b>와 <b>{lostStories}개의 스토리</b>가<br/>
                  영영 사라집니다. 되돌릴 수 없어요.<br/>
                  새 책은 <b>{resetDate}</b>부터 시작합니다.
                </div>
                <input
                  className="rs-type"
                  value={confirmText}
                  onChange={e=>setConfirmText(e.target.value)}
                  placeholder="지우려면 '새 책'이라고 적어주세요"
                />
                <div className="rs-acts">
                  <button className="rs-cancel" onClick={closeReset}>그만두기</button>
                  <button className="rs-go" disabled={confirmText.trim() !== "새 책" || wiping} onClick={doReset}>
                    {wiping ? "지우는 중…" : "지우고 시작"}
                  </button>
                </div>
              </div>
            )}
          </div>
        </div>,
        document.body
      )}
    </div>
  );
}

// 표지 디자인 갤러리 (전체 화면 오버레이 — Portal로 document.body에 렌더)

  const images = rawImages.map(normImg);

  const onFile = async (e) => {
    const f = e.target.files[0]; if (!f) return;

    e.target.value = "";

  const addImageWithCategory = (cat) => {
    if (!pendingImg) return;
    const newImages = [...images, {img: pendingImg, cat}];

// 페이지 ③ 클라이맥스 — 올해 시리즈의 결말 장면 묘사
// 정체성(제목)을 가지고 한 해를 살아갔을 때 도달할 클라이맥스 장면을
// 미리 묘사·선언하는 페이지. 소설의 하이라이트를 미리 써보는 시간.
// ═════════════════════════════════════════════════════════════════════
// 자동 확장 textarea (작성한 만큼 늘어남 — 문장 안 잘림)
function AutoTA({value, onChange, onBlur, placeholder, className}) {
  const ref = useRef(null);
  const resize = () => { const el = ref.current; if (el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; } };
  useEffect(() => { resize(); }, [value]);
  return <textarea ref={ref} className={className} rows={1} value={value} placeholder={placeholder}
    onChange={e=>{ onChange(e); resize(); }} onInput={resize} onBlur={onBlur}/>;
}

// 인증 사진 — 예전 기록은 base64가 본문에 그대로(src), 새 기록은 photoId만 들고 있다.
// 둘 다 받아서 알아서 그린다.
function Photo({src, id, alt, className, style, onClick}) {
  const [url, setUrl] = useState(src || (id ? photoCache.get(id) : null) || null);
  useEffect(() => {
    if (src) { setUrl(src); return; }
    if (!id) { setUrl(null); return; }
    const hit = photoCache.get(id);
    if (hit) { setUrl(hit); return; }
    let alive = true;
    loadPhoto(id).then(d => { if (alive) setUrl(d); });
    return () => { alive = false; };
  }, [src, id]);

  if (!url) {
    return <div className={className} style={{...(style||{}), minHeight:"54px",
      background:"rgba(120,90,40,.09)", border:"1px dashed rgba(120,90,40,.2)"}}/>;
  }
  return <img src={url} alt={alt||""} className={className} style={style} onClick={onClick}/>;
}

// 장서표 — 필명을 적는 자리.
// mode="first" 시작할 때 한 번(문 열리기 전) · mode="edit" 메뉴에서 이름을 눌렀을 때
function PenNamePlate({mode, initial, intro, suggestion, handle, uid, onSave, onClose}) {
  const [v, setV] = useState(initial || suggestion || "");
  const [saving, setSaving] = useState(false);
  const first = mode === "first";
  const onlyHandle = mode === "handle";     // 처음 내보낼 때 — 주소만 묻는다
  const name = v.trim();

  // 책장 주소 — 아직 안 정한 사람에게만 입력칸이 뜬다
  const [h, setH] = useState("");
  const [hState, setHState] = useState({kind:"idle", msg:""});   // idle|checking|ok|bad
  const [claiming, setClaiming] = useState(false);
  const hRef = useRef(0);

  useEffect(() => {
    if (first || handle) return;   // 첫 화면이거나 이미 정했으면 확인할 게 없다
    const raw = h.trim().toLowerCase();
    if (!raw) { setHState({kind:"idle", msg:""}); return; }
    const err = handleError(raw);
    if (err) { setHState({kind:"bad", msg:err}); return; }
    setHState({kind:"checking", msg:"확인하는 중…"});
    const seq = ++hRef.current;
    const t = setTimeout(async () => {
      const free = await isHandleFree(raw);
      if (seq !== hRef.current) return;
      if (free) { setHState({kind:"ok", msg:"쓸 수 있어요"}); return; }
      const alt = await suggestHandle(raw);
      if (seq !== hRef.current) return;
      setHState({kind:"bad", msg:"이미 쓰고 있는 주소예요", alt});
    }, 450);
    return () => clearTimeout(t);
  }, [h, first, handle]);

  const [bio, setBio] = useState(intro || "");
  useEffect(() => { setBio(intro || ""); }, [intro]);

  const submit = async () => {
    if (!name || saving) return;
    setSaving(true);
    await onSave(first ? {penName: name} : {penName: name, intro: bio.trim()});
    setSaving(false);
  };

  const claim = async () => {
    const raw = h.trim().toLowerCase();
    if (hState.kind !== "ok" || claiming) return;
    if (!confirm(`책장 주소를 '${raw}'로 정합니다.\n한번 정하면 바꿀 수 없어요.`)) return;
    setClaiming(true);
    try {
      await claimHandle(uid, raw);
      await onSave({handle: raw});
    } catch (e) {
      console.warn("claim failed:", e);
      setHState({kind:"bad", msg:"방금 다른 분이 가져갔어요. 다른 주소로 해주세요"});
    }
    setClaiming(false);
  };

  const plate = (
    <div className="pn-plate" onClick={e=>e.stopPropagation()}>
      <div className="pn-ex">Ex Libris</div>
      <div className="pn-h">
        {first ? "이 책을 쓰는 이름" : onlyHandle ? "책장 주소 정하기" : "필명 고치기"}
      </div>
      <div className="pn-sub">
        {first
          ? <span>앞으로의 기록에 붙을 이름입니다<br/>본명이 아니어도 됩니다</span>
          : onlyHandle
          ? <span>처음으로 무언가를 내보내는 참입니다<br/><b>{initial}</b>의 책장이 놓일 자리를 정해 주세요</span>
          : <span>읽는 사람이 부르게 될 이름입니다</span>}
      </div>
      <div className="pn-rule"/>

      {!onlyHandle && (
        <div>
          <div className="pn-l">필명</div>

// 하루의 끝 — Key Scene과 한 줄을 남기고, 진열대로 내보낸다.
// Today와 Story의 날짜 상세가 같은 것을 쓴다.
function DayShare({date, rec, updateRec, uid, profile, onNeedHandle, todayLabel}) {
  const [busy, setBusy] = useState(false);
  const eps = dayEpisodes(rec);
  const withPhoto = eps.filter(t => t.photo || t.photoId);
  const remaining = ((rec && rec.tasks) || []).filter(t => !t.done).length;
  const canPublish = isPageDone(rec) && eps.length > 0;
  const published = !!(rec && rec.published);
  const keyId = (rec && rec.keyScene) || null;
  const handle = (profile && profile.handle) || "";

  // 내보낸 뒤에 내용이 바뀌면 진열된 사본도 따라 바뀐다
  const sig = published
    ? JSON.stringify([eps.map(t => [t.id, t.doneAt, t.photoId, t.memo]), (rec||{}).caption, keyId])
    : "";
  useEffect(() => {
    if (!published || !sig || !handle) return;
    const t = setTimeout(() => {
      publishDay(uid, profile, date, rec).catch(e => console.warn("resync:", e));
    }, 900);
    return () => clearTimeout(t);
  // eslint-disable-next-line
  }, [sig, published, handle]);

  const toggle = async () => {
    if (busy) return;
    if (!published && !canPublish) return;
    if (!published && !handle) { onNeedHandle(); return; }
    setBusy(true);
    try {
      if (published) {
        await unpublishDay(uid, handle, date, rec);
        updateRec({published: false});
      } else {
        await publishDay(uid, profile, date, rec);
        updateRec({published: true});
      }
    } catch (e) {
      console.warn("publish toggle:", e);
      alert("잘 안 됐어요. 잠시 뒤 다시 해주세요.");
    }
    setBusy(false);
  };

  return (
    <div>
      <div className="ks">
        <div className="ks-h">
          <span className="k">KEY SCENE</span>
          <span className="s">{todayLabel ? "오늘의 한 장면" : "이 날의 한 장면"}</span>
        </div>

        {withPhoto.length === 0 ? (
          <div className="ks-n">인증한 사진이 생기면 여기서 고를 수 있어요</div>
        ) : (
          <div>
            <div className="ks-row">
              {withPhoto.map(t => (
                <button key={t.id} className={"ks-t" + (keyId === t.id ? " on" : "")}
                  title={t.text}
                  onClick={()=>updateRec({keyScene: keyId === t.id ? null : t.id})}>
                  <Photo src={t.photo} id={t.photoId}
                    style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
                  {keyId === t.id && <b>★</b>}
                </button>
              ))}
            </div>
            <div className="ks-n">
              {keyId ? "이 장면이 진열대의 얼굴이 됩니다"
                     : "대표하는 한 장면을 고르세요 · 안 고르면 첫 사진으로 나갑니다"}
            </div>
          </div>
        )}

        <div className="ks-cap">
          <div className="ks-cl">한 줄 <span>· 선택</span></div>
          <AutoTA className="ks-ci" value={(rec && rec.caption) || ""}
            placeholder="오늘은 무엇이었나요"
            onChange={e=>updateRec({caption: e.target.value})}/>
        </div>
      </div>

      <div className={"sh " + (published ? "on" : canPublish ? "" : "off")}>
        <div className="sh-h">
          <span className="t">이 페이지 내보내기</span>
          <button className="sh-sw" onClick={toggle} disabled={busy || (!published && !canPublish)}
            title={published ? "진열대에서 내리기" : "진열대에 올리기"}/>
        </div>
        <div className="sh-d">
          {busy ? "잠시만요…"
            : published ? (
              <span>
                진열 중 · <span className="u">pullstory.net/p/{handle}/{date}</span><br/>
                내리면 진열만 그만두고 기록은 그대로 남습니다
              </span>
            ) : canPublish ? (
              <span>이 하루를 진열대에 올립니다 · 언제든 내릴 수 있어요</span>
            ) : eps.length === 0 ? (
              <span>아직 끝낸 에피소드가 없어요</span>
            ) : (
              <span>
                <b>{remaining}개만 더</b> 끝내면 내보낼 수 있어요<br/>
                다 채운 하루만 진열대에 올라갑니다
              </span>
            )}
        </div>
      </div>
    </div>
  );
}

// 서버에 저장하는 입력칸 — 치는 동안에는 서버 값을 되돌려 넣지 않는다.
// 한글은 조합 중에 값이 갈아끼워지면 자모가 풀려서 '행복해'가 'ㅎ해행ㅂ보복ㅎ해'가 된다.
function useBuffered(remote, save, delay) {
  const [v, setV] = useState(remote || "");
  const typing = useRef(false);
  const timer = useRef(null);
  const latest = useRef({v: remote || "", typing: false, save});
  latest.current = {v, typing: typing.current, save};

  useEffect(() => { if (!typing.current) setV(remote || ""); }, [remote]);
  // 화면을 떠날 때 아직 안 보낸 게 있으면 마저 보낸다
  useEffect(() => () => {
    clearTimeout(timer.current);
    const st = latest.current;
    if (st.typing) st.save(st.v);
  }, []);

  const onChange = (nv) => {
    typing.current = true;
    setV(nv);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => { typing.current = false; latest.current.save(nv); }, delay || 700);
  };
  const flush = () => {
    clearTimeout(timer.current);
    if (typing.current) { typing.current = false; save(v); }
  };
  return [v, onChange, flush];
}

function BufferedInput({value, onSave, ...rest}) {
  const [v, onChange, flush] = useBuffered(value, onSave);
  return <input {...rest} value={v} onChange={e=>onChange(e.target.value)} onBlur={flush}/>;
}

function BufferedTA({value, onSave, className, placeholder}) {
  const [v, onChange, flush] = useBuffered(value, onSave);
  const ref = useRef(null);
  const resize = () => { const el = ref.current; if (el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; } };
  useEffect(() => { resize(); }, [v]);
  return <textarea ref={ref} className={className} rows={1} value={v} placeholder={placeholder}
    onChange={e=>{ onChange(e.target.value); resize(); }} onInput={resize} onBlur={flush}/>;
}

function Spine({b}) {
  return <div className="sf-sp" style={{width:b.w+"px",height:b.h+"px",background:b.c}}>{b.d ? <span className={b.d}/> : null}</div>;
}
