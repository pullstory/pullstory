<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scash Book">
<meta name="theme-color" content="#3a2c1e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Scash Book — 나의 인생 스토리</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&family=Nanum+Pen+Script&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body,#root{height:100%}
  body{font-family:'Noto Sans KR',sans-serif;background:#1a0f08;overflow:hidden;color:#3a2818}
  input,textarea,select,button{font-family:inherit;outline:none;color:inherit}
  textarea{resize:vertical;font-family:'Noto Sans KR',sans-serif}

  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeOut{from{opacity:1}to{opacity:0}}
  @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  @keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
  @keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:#b8924a55;border-radius:2px}

  /* Paper textures */
  .paper{
    background:
      radial-gradient(circle at 20% 30%, rgba(237,226,197,.4) 0, transparent 60%),
      radial-gradient(circle at 80% 70%, rgba(232,220,181,.3) 0, transparent 60%),
      linear-gradient(#f5ecd9, #f1e6cf);
  }
  .paper-edge{
    box-shadow:
      inset 0 0 50px rgba(139,90,43,.10),
      0 0 0 1px rgba(139,90,43,.12),
      0 4px 14px rgba(0,0,0,.25);
  }
  .gold{color:#9c7a2a}
  .ink{color:#3a2818}

  .btn-gold{
    background:linear-gradient(135deg,#d4a851,#b8862f);
    color:#fff8e5;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(155,120,40,.4);
    transition:all .15s;
    letter-spacing:.5px;
  }
  .btn-gold:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(155,120,40,.55)}
  .btn-gold:active{transform:translateY(0);box-shadow:0 1px 3px rgba(155,120,40,.4)}
  .btn-gold:disabled{background:#d8c79a;cursor:not-allowed;box-shadow:none;transform:none}

  .input{
    width:100%;
    padding:10px 12px;
    background:rgba(255,253,245,.7);
    border:1px solid #d8c79a;
    border-radius:6px;
    color:#3a2818;
    font-size:14px;
    transition:border-color .15s,background .15s;
  }
  .input:focus{border-color:#b8862f;background:#fffdf5}
  .input::placeholder{color:#b89066}

  .heading-serif{font-family:'Noto Serif KR',serif}
  .heading-script{font-family:'Nanum Pen Script',cursive;line-height:1.2}
  .heading-latin{font-family:'Cormorant Garamond',serif;font-style:italic}

  .page-wrap{padding:14px 12px;min-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}
  /* ===== PULLSTORY 시작 화면 — 문(Door) ===== */
  .pd-scene{position:absolute;inset:0;border-radius:12px;overflow:hidden;perspective:1500px;background:radial-gradient(ellipse at 50% 42%,#3a2614,#180d05 82%)}
  .pd-interior{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3%;text-align:center;padding:8%}
  .pd-halo{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(245,222,150,.4),rgba(212,168,81,.1) 46%,transparent 70%)}
  .pd-room{position:relative;width:88%;max-height:56%;object-fit:contain;opacity:0;transform:scale(.94);transition:opacity .55s ease .35s,transform .7s ease .35s;filter:drop-shadow(0 10px 26px rgba(0,0,0,.55))}
  .pd-scene.pd-open .pd-room{opacity:1;transform:scale(1)}
  .pd-msg{position:relative;opacity:0;transition:opacity .5s ease .6s;text-shadow:0 2px 12px rgba(0,0,0,.6)}
  .pd-scene.pd-open .pd-msg{opacity:1}
  .pd-casing{position:absolute;inset:0;padding:5% 5% 0;box-sizing:border-box}
  .pd-leaf{position:relative;width:100%;height:100%;transform-origin:right center;transform:rotateY(0);opacity:1;transition:transform 1.15s cubic-bezier(.5,.05,.35,1),opacity .35s ease .85s;border-radius:44% 44% 6% 6%/24% 24% 4% 4%;background:repeating-linear-gradient(92deg,rgba(0,0,0,.05) 0 2px,rgba(255,255,255,.015) 2px 3px,transparent 3px 11px),linear-gradient(96deg,#7c5930,#6a481f 45%,#5a3c1a);box-shadow:inset 0 0 0 3px #4a3115,inset 0 0 0 5px rgba(212,168,81,.3),0 14px 34px rgba(0,0,0,.55),-6px 0 18px rgba(0,0,0,.35);border:1px solid #33200e}
  .pd-scene.pd-open .pd-leaf{transform:rotateY(-116deg);opacity:0}
  .pd-leaf::before{content:"";position:absolute;inset:5%;border:1px solid rgba(212,168,81,.22);border-radius:40% 40% 4% 4%/22% 22% 3% 3%;pointer-events:none}
  .pd-window{position:absolute;top:8%;left:16%;width:68%;height:40%;border-radius:48% 48% 6% 6%/40% 40% 5% 5%;background:radial-gradient(ellipse at 50% 42%,#fbf2d8,#ecd399 48%,#cba25b 78%,#a67c3d);box-shadow:inset 0 0 22px rgba(120,80,30,.5),0 0 0 3px #4a3115,0 0 0 5px rgba(212,168,81,.4);overflow:hidden}
  .pd-window img{width:100%;height:100%;object-fit:cover;display:block}
  .pd-light{position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.4),transparent 42%);pointer-events:none}
  .pd-plaque{position:absolute;top:51%;left:50%;transform:translateX(-50%);background:radial-gradient(ellipse at 50% 35%,#2c1c0d,#1a1006);border:2px solid #b8862f;border-radius:50%/46%;padding:8px 20px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.5),inset 0 0 14px rgba(0,0,0,.6)}
  .pd-plaque b{display:block;font-family:'Cormorant Garamond',Georgia,serif;color:#e3b662;font-size:clamp(12px,3.6vw,15px);font-weight:700;letter-spacing:.1em;line-height:1.05}
  .pd-plaque i{position:absolute;top:-10px;height:11px;width:1.5px;background:#8a6a34}
  .pd-plaque i.l{left:30%;transform:rotate(14deg)}
  .pd-plaque i.r{right:30%;transform:rotate(-14deg)}
  .pd-knob{position:absolute;top:63%;left:9%;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 34% 30%,#f4dca0,#c79445 55%,#7f571f);box-shadow:0 2px 5px rgba(0,0,0,.55),inset 0 0 0 1px rgba(0,0,0,.25)}
  .pd-plate{position:absolute;bottom:9%;left:18%;width:64%;height:15%;border-radius:5px;background:linear-gradient(180deg,rgba(0,0,0,.16),rgba(0,0,0,.28));box-shadow:inset 0 0 0 2px #4a3115,inset 0 0 14px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center}

  /* ===== Vision 페이지 — 비전보드 ===== */
  .vb-head{text-align:center;margin:2px 0 16px}
  .vb-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:32px;color:#2f2109;font-weight:700;letter-spacing:.01em;line-height:1}
  .vb-desc{font-family:'Noto Serif KR',serif;font-size:12px;color:#7a5e34;margin-top:8px}
  .vb-board{border-radius:8px;padding:18px 13px 22px;border:8px solid #6a481f;background-color:#c6a373;background-image:radial-gradient(circle at 1px 1px,rgba(96,62,26,.24) 1px,transparent 0);background-size:7px 7px;box-shadow:inset 0 0 26px rgba(70,44,16,.4),0 6px 16px rgba(0,0,0,.3)}
  .vb-pin{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd9d3,#c6403a 60%,#7e211c);box-shadow:0 2px 4px rgba(0,0,0,.4);pointer-events:none}
  .vb-pin.g{background:radial-gradient(circle at 35% 30%,#f6e0a4,#c79445 60%,#7f571f)}
  .vb-card{position:relative;background:#fffdf5;border-radius:3px;box-shadow:0 7px 16px rgba(40,25,10,.28)}
  .vb-id{padding:16px 16px 13px;margin-bottom:20px;transform:rotate(-.6deg)}
  .vb-lbl{font-size:10px;letter-spacing:.2em;color:#b58a3e;text-transform:uppercase;text-align:center;margin-bottom:8px}
  .vb-hint{font-family:'Noto Serif KR',serif;font-size:10px;color:#a98b57;font-style:italic;text-align:center;margin-top:8px}
  .vb-cashlbl{text-align:center;font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#5c3f1c;font-weight:700;margin:2px 0 4px}
  .vb-cashsub{text-align:center;font-family:'Noto Serif KR',serif;font-size:11px;color:#6f5127;margin:0 0 13px}
  .vb-cc{position:relative;background:#fffdf5;border-radius:3px;padding:12px 14px;box-shadow:0 6px 14px rgba(40,25,10,.25);margin-bottom:13px}
  .vb-cc:nth-child(odd){transform:rotate(-.5deg)} .vb-cc:nth-child(even){transform:rotate(.5deg)}
  .vb-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .vb-bdg{width:24px;height:24px;border-radius:5px;color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:Georgia,serif;flex-shrink:0}
  .vb-nm{font-family:'Noto Serif KR',serif;font-size:13px;font-weight:700;color:#3a2818}
  .vb-nm .en{font-size:9px;color:#a08048;font-weight:400;letter-spacing:.06em;margin-left:6px}
  .vb-ta{width:100%;box-sizing:border-box;background:transparent;border:none;resize:none;outline:none;font-family:'Noto Serif KR',serif;font-size:13px;color:#3a2818;line-height:1.6;padding:2px 0}
  .vb-ta::placeholder{color:#c9b389}
  .vb-ta:focus{background:rgba(212,168,81,.09);border-radius:3px}
  .vb-id .vb-ta{text-align:center;font-size:16px;font-weight:700;color:#2e2013;line-height:1.55}
  .vb-gallery{display:flex;justify-content:center;margin-top:2px}
  .vb-polaroid{position:relative;background:#fffef9;padding:9px 9px 20px;box-shadow:0 8px 18px rgba(40,25,10,.3);transform:rotate(1.6deg);cursor:pointer}
  .vb-pic{width:150px;height:132px;border-radius:2px;background:linear-gradient(135deg,#8a6730,#5a3f1c);background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;color:#e8cf95;font-size:26px}
  .vb-capn{text-align:center;font-size:15px;color:#5c3f1c;margin-top:7px}

  /* ===== Shelf 페이지 — 책장 ===== */
  .sf-head{text-align:center;margin-bottom:15px}
  .sf-title{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;color:#2f2109;font-weight:700;line-height:1}
  .sf-desc{font-family:'Noto Serif KR',serif;font-size:12px;color:#7a5e34;margin-top:7px}
  .sf-case{border:9px solid #5c3d18;border-radius:6px;background:#2a1c0f;box-shadow:0 8px 22px rgba(0,0,0,.4),inset 0 0 0 2px rgba(0,0,0,.4)}
  .sf-shelf{position:relative}
  .sf-int{position:relative;background:#241a10;padding:11px 9px 12px;display:flex;align-items:flex-end;gap:7px;overflow:hidden}
  .sf-plank{height:11px;background:linear-gradient(180deg,#9a6528,#6a441f);box-shadow:0 4px 7px rgba(0,0,0,.45)}
  .sf-spark{position:absolute;color:#e8c877;font-size:8px;opacity:.55;pointer-events:none}
  .sf-letter{width:42px;height:58px;border-radius:2px;color:#fff8e5;font-family:Georgia,serif;font-weight:700;font-size:29px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.45);flex-shrink:0}
  .sf-cblock{padding:0 12px;min-height:58px;border-radius:2px;background:linear-gradient(180deg,#d8a63f,#b8862f);color:#3a2610;font-family:'Cormorant Garamond',Georgia,serif;font-weight:700;font-size:22px;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 8px rgba(0,0,0,.45);flex-shrink:0}
  .sf-spines{display:flex;align-items:flex-end;gap:3px;flex-shrink:0}
  .sf-sp{border-radius:1px;box-shadow:0 3px 6px rgba(0,0,0,.35);position:relative}
  .sf-sp .d{position:absolute;left:50%;top:9px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:rgba(255,240,190,.55)}
  .sf-sp .dm{position:absolute;left:50%;top:8px;transform:translate(-50%,0) rotate(45deg);width:5px;height:5px;background:rgba(255,240,190,.5)}
  .sf-note{flex:1;min-width:0;align-self:stretch;background:#fffdf5;border-radius:2px;padding:9px 11px;box-shadow:0 4px 11px rgba(0,0,0,.45);display:flex;flex-direction:column;justify-content:center}
  .sf-nl{font-family:'Noto Serif KR',serif;font-size:11px;font-weight:700;margin-bottom:4px}
  .sf-nl .en{font-size:8px;color:#a08048;margin-left:5px;font-weight:400;letter-spacing:.05em}
  .sf-ta{width:100%;box-sizing:border-box;background:transparent;border:none;resize:none;outline:none;overflow:hidden;font-family:'Noto Serif KR',serif;font-size:12.5px;color:#3a2818;line-height:1.55;padding:0;display:block}
  .sf-ta::placeholder{color:#c9b389}

  /* ===== Books 페이지 — My Books ===== */
  .mb-ovbox{border:8px solid #5c3d18;border-radius:6px;background:#241a10;box-shadow:0 7px 18px rgba(0,0,0,.4);overflow:hidden;margin-bottom:18px}
  .mb-ovtop{display:flex;align-items:center;justify-content:space-between;padding:6px 11px;background:linear-gradient(180deg,#6a441f,#4e3417);color:#e8c877}
  .mb-ynav{display:flex;align-items:center;gap:7px}
  .mb-ynav button{background:none;border:none;color:#caa869;font-size:18px;cursor:pointer;padding:0 3px;line-height:1;font-family:Georgia,serif}
  .mb-ynav button:disabled{opacity:.3;cursor:default}
  .mb-ynav b{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:16px;letter-spacing:.08em;color:#e8c877}
  .mb-ovt{font-family:'Noto Serif KR',serif;font-size:11px;color:#d3ac6a}
  .mb-ovgrid{display:grid;grid-template-columns:1fr 1fr}
  .mb-ovcell{position:relative;padding:9px 10px 10px;display:flex;align-items:flex-end;gap:6px;min-height:56px;border-bottom:5px solid #6a441f}
  .mb-ovcell:nth-child(odd){border-right:4px solid #4e3417}
  .mb-ovcell:nth-child(n+3){border-bottom:none}
  .mb-ovL{font-family:Georgia,serif;font-weight:700;font-size:26px;line-height:.9;flex-shrink:0;text-shadow:0 2px 3px rgba(0,0,0,.5)}
  .mb-ovsp{display:flex;align-items:flex-end;gap:2px}
  .mb-ovsp i{border-radius:1px;display:block}
  .mb-ovn{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:700;color:#e6cd94;line-height:1}
  .mb-ovn em{font-style:normal;color:#8a6a3a}
  .mb-ovn small{font-family:'Noto Serif KR',serif;font-size:9px;color:#c9a56a;margin-left:1px;font-weight:400}
  .mb-nb{background:#fffdf5;border-radius:6px;padding:13px;box-shadow:0 5px 14px rgba(40,25,10,.22);margin-bottom:18px;border-top:3px solid #b8862f}
  .mb-nbl{font-family:'Cormorant Garamond',Georgia,serif;font-size:18px;font-weight:700;color:#2f2109}
  .mb-nbd{font-family:'Noto Serif KR',serif;font-size:11px;color:#8a6d3c;margin:2px 0 11px}
  .mb-nbi{width:100%;box-sizing:border-box;border:1px solid #d8c79a;border-radius:6px;background:rgba(255,253,245,.8);padding:9px 11px;font-family:'Noto Serif KR',serif;font-size:13px;color:#3a2818;margin-bottom:9px}
  .mb-nbrow{display:flex;align-items:center;gap:7px;margin-bottom:11px;flex-wrap:wrap}
  .mb-chip{width:26px;height:26px;border-radius:6px;color:#fff;font-family:Georgia,serif;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.2);cursor:pointer}
  .mb-chip.off{opacity:.32}
  .mb-tsel{margin-left:auto;display:flex;border:1px solid #d8c79a;border-radius:7px;overflow:hidden}
  .mb-tsel span{padding:6px 9px;font-family:'Noto Serif KR',serif;font-size:11px;color:#9c7a2a;cursor:pointer}
  .mb-tsel span.on{background:#e9d7ad;color:#5c3f1c;font-weight:700}
  .mb-addb{width:100%;padding:11px;border:none;border-radius:7px;background:linear-gradient(135deg,#e7c574,#b8862f);color:#fff8e5;font-family:'Noto Serif KR',serif;font-weight:700;font-size:13px;letter-spacing:.2em;cursor:pointer}
  .mb-shelflbl{font-family:'Noto Serif KR',serif;font-size:12px;color:#5c3f1c;font-weight:700;margin:2px 2px 11px}
  .mb-covers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mb-cover{position:relative;aspect-ratio:3/4.2;border-radius:3px 6px 6px 3px;overflow:hidden;box-shadow:0 8px 16px rgba(0,0,0,.32);display:flex;cursor:pointer}
  .mb-cspine{width:9px;flex-shrink:0}
  .mb-cin{flex:1;position:relative;padding:14px 12px;display:flex;flex-direction:column}
  .mb-cfr{position:absolute;inset:8px;border:1px solid rgba(255,248,220,.4);border-radius:3px;pointer-events:none}
  .mb-ctype{font-family:'Noto Serif KR',serif;font-size:9px;font-weight:700;letter-spacing:.08em;color:rgba(255,248,220,.85)}
  .mb-cttl{font-family:'Noto Serif KR',serif;font-size:15px;font-weight:700;color:#fff8e5;line-height:1.4;margin-top:auto;text-shadow:0 1px 4px rgba(0,0,0,.4)}
  .mb-cst{font-family:'Cormorant Garamond',serif;font-size:10px;font-style:italic;color:rgba(255,248,220,.75);margin-top:6px}
  .mb-ov{position:fixed;inset:0;z-index:10000;background:rgba(20,12,5,.55);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:18px 12px;box-sizing:border-box;animation:fadeIn .2s}
  .mb-page{width:100%;max-width:400px;border-radius:9px;background:#f3e9d1;background-image:radial-gradient(circle at 60% 0%,#f8f1de,#eaddbf 75%);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .mb-dbar{display:flex;align-items:center;justify-content:space-between;padding:12px 13px 10px}
  .mb-back{background:none;border:none;color:#8a6a3a;font-family:'Noto Serif KR',serif;font-size:12px;font-weight:700;cursor:pointer}
  .mb-pill{border:none;font-family:'Noto Serif KR',serif;font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;background:rgba(212,168,81,.18);color:#9c7a2a;cursor:pointer}
  .mb-dhead{display:flex;align-items:center;gap:11px;padding:4px 15px 14px;border-bottom:1px solid rgba(120,90,40,.18);margin-bottom:14px}
  .mb-mini{width:34px;height:46px;border-radius:2px 3px 3px 2px;display:flex;flex-shrink:0;box-shadow:0 4px 9px rgba(0,0,0,.25);overflow:hidden}
  .mb-mspine{width:6px}
  .mb-mbody{flex:1;display:flex;align-items:center;justify-content:center;color:#fff8e5;font-family:Georgia,serif;font-weight:700;font-size:17px}
  .mb-dtitle{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700;color:#2e2013;line-height:1.3}
  .mb-dmeta{font-family:'Noto Serif KR',serif;font-size:10px;color:#a0824a;margin-top:4px}
  .mb-dpad{padding:0 15px 16px}
  .mb-g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
  .mb-fld{min-width:0}
  .mb-fl{font-family:'Noto Serif KR',serif;font-size:9px;font-weight:700;color:#9c7f4e;margin-bottom:4px}
  .mb-callbl{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 7px;font-family:'Noto Serif KR',serif;font-size:10px;font-weight:700;color:#9c7f4e}
  .mb-callbl b{font-weight:700}
  .mb-cal{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
  .mb-cell{aspect-ratio:1;border-radius:3px;font-size:8px;font-weight:700;background:rgba(245,236,217,.8);border:1px solid #ddcb9f;color:#a08a5e;font-family:Georgia,serif;cursor:default;padding:0}
  .mb-cell.on{background:#5a8c4a;border-color:#4a7c3a;color:#fff}
  .mb-bar{height:5px;background:#e8dcb5;border-radius:3px;overflow:hidden;margin-top:9px}
  .mb-bar span{display:block;height:100%;background:linear-gradient(90deg,#5a8c4a,#4a7c3a);border-radius:3px}
  .mb-foot{display:flex;gap:9px;margin-top:16px}
  .mb-fbtn{flex:1;padding:10px;border-radius:7px;font-family:'Noto Serif KR',serif;font-size:12px;font-weight:700;text-align:center;cursor:pointer;border:none}

// 사진 압축 → base64
function compressPhoto(file, maxW=720, quality=0.7) {
  return new Promise((res) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const c = document.createElement("canvas");
        const ratio = Math.min(maxW/img.width, maxW/img.height, 1);
        c.width = Math.round(img.width*ratio);
        c.height = Math.round(img.height*ratio);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// ═════════════════════════════════════════════════════════════════════
const LS_KEY = "scashbook_data";
const LS_AUTH = "scashbook_local_user";

function loadLocal() {
  try { const d = localStorage.getItem(LS_KEY); return d ? JSON.parse(d) : null; }
  catch(e) { return null; }
}
function saveLocal(d) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(d)); } catch(e) {}
}

let saveTimer = null;
function scheduleSave(uid, data) {
  saveLocal(data);
  if (!FIREBASE_READY || !uid || uid === "local-user") return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    fbDb.collection("scashbook").doc(uid).set(data, {merge:true}).catch(e => console.warn("Save failed:", e));
  }, 800);
}

async function loadRemote(uid) {
  if (!FIREBASE_READY || !uid) return null;
  try {
    const snap = await fbDb.collection("scashbook").doc(uid).get();
    return snap.exists ? snap.data() : null;
  } catch(e) { console.warn("Load failed:", e); return null; }
}

    // 2.5s: 본문 진입 (메시지 약 1.4초 노출)
    setTimeout(() => onStart(), 2500);
  };

  return (
    <div style={{
      height:"100%",
      background:"radial-gradient(ellipse at 30% 20%, #4a3520, #1a0f08 80%)",
      display:"flex",alignItems:"center",justifyContent:"center",
      padding:"14px",
      overflow:"hidden"
    }}>
      {/* 프레임 (2:3) — viewport에 들어맞게 캡 */}
      <div style={{
        width:"min(330px, calc(100vw - 28px), calc((100vh - 28px) * 0.667))",
        aspectRatio:"2 / 3",
        position:"relative",
        animation:opening?"none":"slideUp .8s ease"
      }}>
        <div className={"pd-scene"+(opening?" pd-open":"")}>

          {/* 문 열리면 드러나는 방 + 문구 */}
          <div className="pd-interior">
            <div className="pd-halo"/>
            <img className="pd-room" src="img/room.webp" alt=""/>
            <div className="pd-msg heading-script" style={{fontSize:"clamp(15px,4.6vw,22px)",color:"#f2e2b6",lineHeight:1.55}}>
              나의 신용은 매일 쌓아가는<br/>스토리에서 시작된다
            </div>
          </div>

          {/* 문 — 오른쪽 경첩으로 회전하며 열림 */}
          <div className="pd-casing">
            <div className="pd-leaf">
              {/* 창문 = Vision 이미지(data.bookCover), 없으면 따뜻한 빛 */}
              <div className="pd-window">
                {data.bookCover ? <img src={data.bookCover} alt=""/> : null}
                <span className="pd-light"/>
              </div>
              <div className="pd-plaque"><i className="l"/><i className="r"/><b>STORY<br/>ROOM</b></div>
              <div className="pd-knob"/>
              <div className="pd-plate">
                <button onClick={handleStart} className="btn-gold" style={{padding:"10px 26px",fontSize:"14px",letterSpacing:"4px",fontWeight:700}}>START</button>
              </div>
            </div>
          </div>

        </div>
      </div>
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════════
// 표지 디자인 갤러리 (전체 화면 오버레이 — Portal로 document.body에 렌더)
// 첫 번째 이미지가 표지 대표 이미지(data.bookCover)
// 각 이미지는 C/A/S/H/Life 카테고리를 가지며 고유색으로 테두리 표시
// ═════════════════════════════════════════════════════════════════════
function CoverGallery({data, setData, onClose}) {
  const fileRef = useRef(null);
  const [selected, setSelected] = useState(null);
  const [pendingImg, setPendingImg] = useState(null); // 카테고리 선택 대기 중인 이미지

  const rawImages = data.visionImages || [];
  const images = rawImages.map(normImg);

  const onFile = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    const b64 = await compressPhoto(f, 800, 0.78);
    setPendingImg(b64);
    e.target.value = "";
  };

  const addImageWithCategory = (cat) => {
    if (!pendingImg) return;
    const newImages = [...images, {img: pendingImg, cat}];
    setData({...data, visionImages: newImages, bookCover: newImages[0].img});
    setPendingImg(null);
  };

  const setAsCover = (i) => {
    if (i === 0) return;
    const newImages = [images[i], ...images.filter((_,j)=>j!==i)];
    setData({...data, visionImages: newImages, bookCover: newImages[0].img});
  };

  const removeImage = (i) => {
    const newImages = images.filter((_,j)=>j!==i);
    setData({...data, visionImages: newImages, bookCover: (newImages[0] && newImages[0].img) || ""});
  };

  const setCategory = (i, cat) => {
    const newImages = images.map((it, j) => j === i ? {...it, cat} : it);
    setData({...data, visionImages: newImages});
  };

  const content = (
    <div style={{position:"fixed",top:0,left:0,right:0,bottom:0,background:"linear-gradient(180deg,#3a2c1e,#1a0f08)",zIndex:9999,display:"flex",flexDirection:"column",animation:"fadeIn .25s",fontFamily:"'Noto Sans KR',sans-serif",color:"#3a2818"}}>
      {/* Header */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"12px 14px",paddingTop:"max(12px,env(safe-area-inset-top))",borderBottom:"1px solid #4a3520",background:"linear-gradient(180deg,rgba(0,0,0,.4),transparent)",flexShrink:0}}>
        <button onClick={onClose} style={{background:"rgba(0,0,0,.4)",border:"1px solid rgba(212,168,81,.4)",color:"#d4a851",borderRadius:"6px",padding:"6px 12px",fontSize:"12px",cursor:"pointer"}}>← 돌아가기</button>
        <div style={{textAlign:"center",pointerEvents:"none"}}>
          <div className="heading-latin" style={{fontSize:"10px",color:"#d4a85188",letterSpacing:"2px",fontFamily:"'Cormorant Garamond',serif",fontStyle:"italic"}}>COVER DESIGN</div>
          <div className="heading-serif" style={{fontSize:"14px",color:"#d4a851",fontWeight:700,fontFamily:"'Noto Serif KR',serif"}}>표지 디자인</div>
        </div>
        <div style={{width:"68px"}}/>
      </div>

      <div style={{flex:1,overflow:"auto",padding:"16px",WebkitOverflowScrolling:"touch"}}>
        <div style={{padding:"12px 14px",background:"rgba(212,168,81,.08)",borderRadius:"8px",marginBottom:"14px",fontSize:"11px",color:"#d4a851aa",textAlign:"center",lineHeight:1.6,border:"1px solid rgba(212,168,81,.15)"}}>
          ✨ 첫 번째 이미지가 표지의 <span style={{color:"#d4a851",fontWeight:700}}>대표 이미지</span>가 됩니다.<br/>
          이미지를 탭해서 카테고리/대표 변경 또는 삭제할 수 있어요.
        </div>

        {/* 카테고리 범례 */}
        <div style={{display:"flex",justifyContent:"center",gap:"6px",marginBottom:"14px",flexWrap:"wrap"}}>
          {CAT_KEYS.map(k=>(
            <div key={k} style={{display:"inline-flex",alignItems:"center",gap:"4px",padding:"3px 8px",background:"rgba(0,0,0,.3)",borderRadius:"12px",border:`1px solid ${CAT_COLOR[k]}66`}}>
              <span style={{width:"8px",height:"8px",borderRadius:"50%",background:CAT_COLOR[k]}}/>
              <span style={{fontSize:"10px",color:CAT_COLOR[k],fontWeight:700}}>{k}</span>
            </div>
          ))}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"8px"}}>
          {images.map((it,i)=>{
            const catColor = it.cat ? CAT_COLOR[it.cat] : null;
            return (
              <div key={i} onClick={()=>setSelected(i)} style={{
                position:"relative",aspectRatio:"1",borderRadius:"8px",overflow:"hidden",
                border: catColor ? `3px solid ${catColor}` : (i===0 ? "2px solid #d4a851" : "1px solid #4a3520"),
                cursor:"pointer",
                boxShadow: catColor ? `0 0 10px ${catColor}55` : (i===0 ? "0 0 12px rgba(212,168,81,.35)" : "none")
              }}>
                <img src={it.img} alt="" style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
                {i===0 && <div style={{position:"absolute",top:"4px",left:"4px",background:"#d4a851",color:"#1a0f08",padding:"2px 6px",borderRadius:"4px",fontSize:"9px",fontWeight:700,letterSpacing:"1px"}}>대표</div>}
                {it.cat && <div style={{position:"absolute",bottom:"4px",left:"4px",background:CAT_COLOR[it.cat],color:"#fff",padding:"2px 6px",borderRadius:"4px",fontSize:"9px",fontWeight:700,letterSpacing:".5px"}}>{it.cat}</div>}
                <div style={{position:"absolute",bottom:"4px",right:"4px",background:"rgba(0,0,0,.6)",color:"#d4a851",padding:"1px 5px",borderRadius:"3px",fontSize:"9px"}}>{i+1}</div>

            );
          })}
          <button type="button" onClick={(e)=>{e.stopPropagation();fileRef.current && fileRef.current.click();}} style={{aspectRatio:"1",border:"2px dashed rgba(212,168,81,.4)",borderRadius:"8px",background:"rgba(212,168,81,.05)",color:"#d4a851",cursor:"pointer",fontSize:"32px",fontWeight:300,display:"flex",alignItems:"center",justifyContent:"center"}}>+</button>
          <input type="file" accept="image/*" ref={fileRef} onChange={onFile} style={{position:"absolute",left:"-9999px",width:"1px",height:"1px",opacity:0}}/>
        </div>

        {images.length === 0 && (
          <div style={{textAlign:"center",marginTop:"24px",fontSize:"11px",color:"#8a7556",lineHeight:1.6}}>

          </div>
        )}
      </div>

      {/* 카테고리 선택 모달 (이미지 추가 시) */}
      {pendingImg && (
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:10001,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px",animation:"fadeIn .2s"}}>
          <div style={{maxWidth:"360px",width:"100%",background:"#3a2c1e",borderRadius:"12px",overflow:"hidden",border:"1px solid #6a5538"}}>
            <div style={{position:"relative",aspectRatio:"3/4",background:`url(${pendingImg}) center/cover, #1a0f08`}}/>
            <div style={{padding:"16px"}}>
              <div className="heading-serif" style={{fontSize:"14px",color:"#d4a851",fontWeight:700,marginBottom:"4px",textAlign:"center",fontFamily:"'Noto Serif KR',serif"}}>카테고리 선택</div>
              <div style={{fontSize:"10px",color:"#9c7a2a",textAlign:"center",marginBottom:"14px"}}>이 이미지가 어떤 영역에 속하나요?</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:"6px"}}>
                {CAT_KEYS.map(k=>(
                  <button key={k} type="button" onClick={()=>addImageWithCategory(k)} style={{
                    padding:"12px 4px",borderRadius:"6px",
                    background:CAT_COLOR[k],color:"#fff",border:"none",
                    cursor:"pointer",fontSize:"13px",fontWeight:700,
                    boxShadow:`0 2px 8px ${CAT_COLOR[k]}66`,
                    display:"flex",flexDirection:"column",alignItems:"center",gap:"3px"
                  }}>
                    <div style={{fontSize:"15px",fontWeight:700}}>{k}</div>
                    <div style={{fontSize:"9px",opacity:.9,fontWeight:500}}>{CAT_LABEL[k]}</div>
                  </button>
                ))}
              </div>
              <button type="button" onClick={()=>setPendingImg(null)} style={{width:"100%",marginTop:"12px",padding:"9px",background:"transparent",border:"1px solid #6a5538",color:"#9c7a2a",borderRadius:"6px",cursor:"pointer",fontSize:"11px"}}>취소</button>
            </div>
          </div>
        </div>
      )}

      {/* Image action modal */}
      {selected !== null && images[selected] && (
        <div onClick={()=>setSelected(null)} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.85)",zIndex:10000,display:"flex",alignItems:"center",justifyContent:"center",padding:"20px",animation:"fadeIn .2s"}}>
          <div onClick={e=>e.stopPropagation()} style={{maxWidth:"360px",width:"100%",background:"#3a2c1e",borderRadius:"12px",overflow:"hidden",border:"1px solid #6a5538",maxHeight:"90vh",overflowY:"auto"}}>
            <div style={{position:"relative",aspectRatio:"1",background:`url(${images[selected].img}) center/cover, #1a0f08`}}>
              {selected === 0 && <div style={{position:"absolute",top:"10px",left:"10px",background:"#d4a851",color:"#1a0f08",padding:"4px 10px",borderRadius:"5px",fontSize:"10px",fontWeight:700,letterSpacing:"1px"}}>현재 대표 이미지</div>}
              {images[selected].cat && <div style={{position:"absolute",top:"10px",right:"10px",background:CAT_COLOR[images[selected].cat],color:"#fff",padding:"4px 10px",borderRadius:"5px",fontSize:"10px",fontWeight:700}}>{images[selected].cat} · {CAT_LABEL[images[selected].cat]}</div>}
            </div>
            <div style={{padding:"14px"}}>
              <div style={{fontSize:"10px",color:"#9c7a2a",fontWeight:700,marginBottom:"6px",letterSpacing:"1px"}}>카테고리</div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:"4px",marginBottom:"14px"}}>
                {CAT_KEYS.map(k=>{
                  const active = images[selected].cat === k;
                  return (
                    <button key={k} type="button" onClick={()=>setCategory(selected, k)} style={{
                      padding:"9px 4px",borderRadius:"5px",
                      background: active ? CAT_COLOR[k] : "transparent",
                      color: active ? "#fff" : CAT_COLOR[k],
                      border:`1.5px solid ${CAT_COLOR[k]}`,
                      cursor:"pointer",fontSize:"12px",fontWeight:700,
                      boxShadow: active ? `0 2px 6px ${CAT_COLOR[k]}55` : "none"
                    }}>{k}</button>
                  );
                })}
              </div>
              {selected !== 0 ? (
                <button type="button" onClick={()=>{setAsCover(selected);setSelected(null);}} className="btn-gold" style={{width:"100%",padding:"11px",fontSize:"13px",marginBottom:"8px"}}>표지 대표 이미지로 설정</button>
              ) : (
                <div style={{textAlign:"center",fontSize:"11px",color:"#d4a851",padding:"8px",background:"rgba(212,168,81,.1)",borderRadius:"6px",marginBottom:"8px"}}>✓ 현재 표지 대표 이미지입니다</div>
              )}
              <button type="button" onClick={()=>{if(confirm("이 이미지를 삭제하시겠습니까?")){removeImage(selected);setSelected(null);}}} style={{width:"100%",padding:"10px",background:"transparent",border:"1px solid #b85450",color:"#e88080",borderRadius:"6px",cursor:"pointer",fontSize:"12px",marginBottom:"6px"}}>삭제</button>
              <button type="button" onClick={()=>setSelected(null)} style={{width:"100%",padding:"8px",background:"transparent",border:"1px solid #6a5538",color:"#9c7a2a",borderRadius:"6px",cursor:"pointer",fontSize:"11px"}}>닫기</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );

  return ReactDOM.createPortal(content, document.body);
}

// 페이지 ③ 클라이맥스 — 올해 시리즈의 결말 장면 묘사
// 정체성(제목)을 가지고 한 해를 살아갔을 때 도달할 클라이맥스 장면을
// 미리 묘사·선언하는 페이지. 소설의 하이라이트를 미리 써보는 시간.
// ═════════════════════════════════════════════════════════════════════
// 자동 확장 textarea (작성한 만큼 늘어남 — 문장 안 잘림)
function AutoTA({value, onChange, onBlur, placeholder, className}) {
  const ref = useRef(null);
  const resize = () => { const el = ref.current; if (el) { el.style.height = "auto"; el.style.height = el.scrollHeight + "px"; } };
  useEffect(() => { resize(); }, [value]);
  return <textarea ref={ref} className={className} rows={1} value={value} placeholder={placeholder}
    onChange={e=>{ onChange(e); resize(); }} onInput={resize} onBlur={onBlur}/>;
}

function Spine({b}) {
  return <div className="sf-sp" style={{width:b.w+"px",height:b.h+"px",background:b.c}}>{b.d ? <span className={b.d}/> : null}</div>;
}

                <AutoTA className="sf-ta" value={yc[s.k]||""} placeholder={s.ph}
                  onChange={e=>setYc({...yc,[s.k]:e.target.value})} onBlur={()=>setData({...data,yearCash:yc})}/>
              </div>
              <div className="sf-spines"><Spine b={s.right}/></div>
            </div>
            <div className="sf-plank"/>
          </div>
        ))}
      </div>
    </div>
  );
}

// 페이지 ④ 챕터 — 12개 챕터(월별)로 구성된 시리즈 인덱스
// 클라이맥스로 가는 12개의 이야기. 월별 계획·실행 피드백.
// ═════════════════════════════════════════════════════════════════════
const TYPE_INFO = {
  habit:       {icon:"🔄", label:"습관", desc:"반복함으로써 기록할 수 있는 스토리",  example:"예: 매일 달리기"},
  achievement: {icon:"🏆", label:"성취", desc:"성취함으로써 기록할 수 있는 스토리",  example:"예: 첫 책 출간 · 새 강좌 런칭 · 자격증 취득"}

// 레거시(goal/event) → achievement 로 정규화
const taskTypeOf = (t) => (t && t.type === "habit") ? "habit" : "achievement";

// CASH 색/이름 (C노랑·A빨강·S파랑·H초록)
const BC = {

          <div className="mb-foot">
            <button className="mb-fbtn done" onClick={()=>toggleStatus(book.id)}>{done?"진행중으로":"✓ 완료로 표시"}</button>

  );
  return ReactDOM.createPortal(overlay, document.body);
}
